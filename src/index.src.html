const digits=s=>String(s??'').replace(/\D/g,'');
function normPhone(s){let d=digits(s);if(!d)return '';if(d.length===9)d='998'+d;if(d.length===12&&d.startsWith('998'))return '+'+d;return (String(s).trim().startsWith('+')?'+':'')+d}
function fmtPhone(s){const n=normPhone(s);const m=n.match(/^\+998(\d{2})(\d{3})(\d{2})(\d{2})$/);return m?`+998 ${m[1]} ${m[2]} ${m[3]} ${m[4]}`:String(s||'').trim()}
const telHref=s=>'tel:'+normPhone(s);
const ago=ts=>{const d=new Date(ts),t=today(),k=daysBetweenISO(isoDate(d),t);const hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');return k===0?'bugun '+hm:k===1?'kecha '+hm:`${k} kun oldin`};
function daysBetweenISO(a,b){return Math.round((parseISO(b)-parseISO(a))/864e5)}
function addMonths(iso,n){const [y,m,d]=iso.split('-').map(Number);const last=new Date(y,m-1+n+1,0).getDate();return isoDate(new Date(y,m-1+n,Math.min(d,last)))}

const clientByPhone=(ph,role)=>{const n=normPhone(ph);return n?S.clients.find(c=>c.phone===n&&(!role||(c.role||'client')===role))||S.clients.find(c=>c.phone===n):null};
async function upsertClient({name,phone,address,role='client'}){
  name=String(name||'').trim();const ph=normPhone(phone);if(!name&&!ph)return null;
  let c=ph?S.clients.find(x=>x.phone===ph):S.clients.find(x=>!x.phone&&x.name.toLowerCase()===name.toLowerCase());
  const roles=new Set([...(c&&c.roles||[c&&c.role||role]),role]);
  c=c?{...c,name:name||c.name,phone:ph||c.phone,address:address||c.address||'',roles:[...roles],updated:Date.now()}:{id:uid('c'),name,phone:ph,address:address||'',roles:[role],created:Date.now(),updated:Date.now()};
  await DB.put('clients',c);const i=S.clients.findIndex(x=>x.id===c.id);if(i>=0)S.clients[i]=c;else S.clients.push(c);return c;
}
const hasRole=(c,r)=>(c.roles||[c.role||'client']).includes(r);
const hasCalls=()=>NATIVE;
const canPickContact=()=>NATIVE||!!(navigator.contacts&&navigator.contacts.select);
async function pickContactAny(){
  if(NATIVE){const r=await plug('PhoneBook').pickContact();return {name:r.name||'',phone:r.number||''}}
  if(navigator.contacts&&navigator.contacts.select){const [c]=await navigator.contacts.select(['name','tel'],{multiple:false});if(!c)throw new Error('cancel');return {name:(c.name||[])[0]||'',phone:(c.tel||[])[0]||''}}
  throw new Error('unsupported');
}

function personHTML(pfx,title,name,phone,{req=false}={}){
  return `<div class="person"><div class="lbl">${title}${req?' <span class="req">*</span>':''}</div>
  <div class="g2"><input class="inp" id="${pfx}Name" value="${esc(name)}" placeholder="Ismi" autocomplete="off" aria-label="${esc(title)}: ismi"><input class="inp num" id="${pfx}Phone" type="tel" inputmode="tel" value="${esc(phone)}" placeholder="+998 __ ___ __ __" autocomplete="off" aria-label="${esc(title)}: telefoni"></div>
  <div class="sug" id="${pfx}Sug"></div>
  ${hasCalls()||canPickContact()?`<div class="pbtns">${hasCalls()?`<button class="btn sm" type="button" id="${pfx}Calls">${ICON.call} Qo'ng'iroqlardan</button>`:''}${canPickContact()?`<button class="btn sm" type="button" id="${pfx}Contact">${ICON.book} Kontaktlardan</button>`:''}</div>`:''}</div>`;
}
function bindPerson(c,pfx,obj,nk,pk,{role='client',onChange}={}){
  const ni=$('#'+pfx+'Name',c),pi=$('#'+pfx+'Phone',c),sg=$('#'+pfx+'Sug',c);
  const set=({name,phone})=>{
    if(phone!=null){obj[pk]=fmtPhone(phone);pi.value=obj[pk]}
    if(name){obj[nk]=name;ni.value=name}else if(phone){const cl=clientByPhone(phone,role);if(cl){obj[nk]=cl.name;ni.value=cl.name}}
    sg.innerHTML='';onChange&&onChange();
  };
  const showSug=q=>{q=String(q).trim().toLowerCase();const qd=digits(q);if(q.length<2){sg.innerHTML='';return}
    const m=S.clients.filter(x=>hasRole(x,role)&&(x.name.toLowerCase().includes(q)||(qd.length>=3&&x.phone.includes(qd)))).slice(0,4);
    sg.innerHTML=m.map(x=>`<button type="button" class="chip" data-cid="${x.id}">${esc(x.name||'—')} · ${esc(fmtPhone(x.phone))}</button>`).join('');
    $$('[data-cid]',sg).forEach(b=>b.onclick=()=>{const x=S.clients.find(z=>z.id===b.dataset.cid);set({name:x.name,phone:x.phone})});
  };
  ni.oninput=()=>{obj[nk]=ni.value;showSug(ni.value);onChange&&onChange()};
  pi.oninput=()=>{obj[pk]=pi.value;showSug(pi.value);onChange&&onChange()};
  pi.onblur=()=>{if(!pi.value.trim())return;pi.value=fmtPhone(pi.value);obj[pk]=pi.value;const cl=clientByPhone(pi.value,role);if(cl&&!ni.value.trim()){ni.value=cl.name;obj[nk]=cl.name}setTimeout(()=>{sg.innerHTML=''},200)};
  const cb=$('#'+pfx+'Calls',c);if(cb)cb.onclick=()=>callsSheet(set);
  const kb=$('#'+pfx+'Contact',c);if(kb)kb.onclick=async()=>{try{set(await pickContactAny())}catch(e){if(!/cancel/i.test(String(e&&(e.code||e.message))))toast("Kontaktni ochib bo'lmadi")}};
}

function mountSig(box,o){

    cv.onpointerdown=e=>{on=true;last=pt(e);try{cv.setPointerCapture(e.pointerId)}catch(er){}ctx.beginPath();ctx.arc(last[0],last[1],2.5,0,7);ctx.fillStyle='#10213a';ctx.fill();e.preventDefault()};
    cv.onpointermove=e=>{if(!on)return;const p=pt(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;e.preventDefault()};
    cv.onpointerup=cv.onpointercancel=()=>{if(!on)return;on=false;o.value=cv.toDataURL('image/png');o.onChange(o.value)};

/* ---------- own cards and card payments ---------- */
const cardDigits=s=>digits(s).slice(0,19);
const fmtCard=s=>cardDigits(s).replace(/(\d{4})(?=\d)/g,'$1 ');
const maskCard=s=>{const d=cardDigits(s);return d.length>=8?d.slice(0,4)+' •••• '+d.slice(-4):fmtCard(s)};
function cardBank(s){const d=cardDigits(s);if(/^(8600|5614)/.test(d))return 'Uzcard';if(/^9860/.test(d))return 'Humo';if(/^220[0-4]/.test(d))return 'Mir';if(/^4/.test(d))return 'Visa';if(/^(5[1-5]|2[2-7])/.test(d))return 'Mastercard';if(/^62/.test(d))return 'UnionPay';return ''}
function luhn(s){const d=cardDigits(s);if(d.length<13)return false;let sum=0,alt=false;for(let i=d.length-1;i>=0;i--){let n=+d[i];if(alt){n*=2;if(n>9)n-=9}sum+=n;alt=!alt}return sum%10===0}
const myCards=()=>S.meta.cards||[];
const cardById=id=>myCards().find(c=>c.id===id);
const cardLabel=c=>c?`${c.label||cardBank(c.number)||'Karta'} · ${maskCard(c.number).slice(-4)}`:'';
const defaultCardFor=w=>{const cs=myCards();return (cs.find(c=>c.wp===w)||cs[0]||{}).id||''};
async function scanCardNumber(file){
  const b=await compress(file,1600,0.88);
  const r=await plug('PhoneBook').recognizeText({base64:b.split(',')[1]});
  const t=String(r.text||'').replace(/[OoОо]/g,'0').replace(/[Il|]/g,'1');
  const cands=(t.match(/\d[\d \-]{11,24}\d/g)||[]).map(digits).filter(x=>x.length>=16&&x.length<=19);
  let best=cands.find(luhn)||'';
  if(!best){const all=digits(t);for(let i=0;i+16<=all.length;i++){const s=all.slice(i,i+16);if(luhn(s)&&/^(8600|5614|9860|4|5|2|62)/.test(s)){best=s;break}}}
  return best||cands[0]||'';
}
function smsAmount(text){
  const t=String(text||'');const out=[];
  const re=/(\d{1,3}(?:[  .,]\d{3})+|\d{4,})(?:[.,](\d{1,2}))?\s*(?:uzs|so['ʻ‘’`]?m|сум|sum)/gi;let m;
  while((m=re.exec(t)))out.push(+digits(m[1]));
  return out;
}
async function pasteText(){
  if(NATIVE){try{const r=await plug('Clipboard').read();return r.value||''}catch(e){}}
  try{return await navigator.clipboard.readText()}catch(e){return null}
}

/* ---------- discounts ---------- */
function discSteps(x){if(!(x>0))return [];const m=Math.pow(10,Math.max(0,Math.floor(Math.log10(x))-2));return [m,5*m,10*m,20*m]}
function parseDisc(str){const s=String(str||'').trim();if(!s)return null;if(/%$/.test(s)){const v=num(s.replace('%',''));return v>0&&v<100?{kind:'pct',v}:null}const v=pos(s);return v?{kind:'sum',v}:null}
function discAmount(f,r){
  const d=f.disc;if(!d||!r.qty||!r.calcSum)return {amount:0,unitPrice:r.price};
  let amount=0;
  if(d.kind==='round'){amount=r.calcSum-Math.floor(r.calcSum/d.v)*d.v}
  else if(f.discOn==='unit'){const per=d.kind==='pct'?r.price*d.v/100:d.v;amount=Math.round(per*r.qty)}
  else amount=d.kind==='pct'?Math.round(r.calcSum*d.v/100):Math.round(d.v);
  amount=Math.max(0,Math.min(amount,r.calcSum));
  return {amount,unitPrice:r.qty?(r.calcSum-amount)/r.qty:r.price};
}

const debtPaid=d=>(d.payments||[]).reduce((a,p)=>a+(+p.amount||0),0);
const debtLeft=d=>Math.max(0,Math.round((+d.total||0)-(+d.down||0)-debtPaid(d)));
function instRows(d){
  let pool=debtPaid(d);const td=today();
  return (d.schedule||[]).slice().sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0).map(it=>{
    const cov=Math.min(+it.amount||0,pool);pool-=cov;const left=Math.round((+it.amount||0)-cov);const dd=daysBetweenISO(td,it.due);
    const st=left<=0?'paid':it.breach?'breach':dd<0?'overdue':dd===0?'today':dd<=3?'soon':'later';
    return {...it,cov,left,st,dd};
  });
}
const debtNext=d=>instRows(d).find(x=>x.left>0)||null;
function debtState(d){
  if(d.status==='draft')return 'draft';
  if(debtLeft(d)<=0)return 'closed';
  const rows=instRows(d);
  if(rows.some(x=>x.st==='breach'))return 'breached';
  if(rows.some(x=>x.st==='overdue'||x.st==='today'))return 'due';
  if(rows.some(x=>x.st==='soon'))return 'soon';
  return 'active';
}

function extendSheet(d,row){
  if(!row)return;
  openSheet('Muddatni cho‘zish',api=>{
    const c=api.content;const f={to:addDays(row.due>today()?row.due:today(),7),reason:''};
    c.innerHTML=`<div class="sh-body"><div class="hint">Hozirgi muddat: <b>${dmy(row.due)}</b> · ${som(row.left)}</div>
      <div class="field"><label for="eTo">Yangi muddat</label><input class="inp" type="date" id="eTo" value="${f.to}" min="${addDays(today(),1)}"></div>
      <div class="field"><label for="eWhy">Sabab (mijoz nima dedi)</label><input class="inp" id="eWhy" placeholder="Masalan: maosh kechikdi, 10-sanada to‘laydi" autocomplete="off"></div>
      <label class="check"><input type="checkbox" id="eLater" checked> Keyingi to‘lovlarni ham shuncha kunga surish</label>
      </div><div class="sh-foot"><button class="btn pri block" type="button" id="eSave">Muddatni cho‘zish</button></div>`;
    $('#eTo',c).onchange=e=>{f.to=e.target.value};$('#eWhy',c).oninput=e=>{f.reason=e.target.value};
    $('#eSave',c).onclick=async()=>{
      if(!f.to||f.to<=today()){toast('Kelajakdagi sanani tanlang');return}
      const shift=daysBetweenISO(row.due,f.to);const it=d.schedule.find(x=>x.id===row.id);
      const later=$('#eLater',c).checked;
      d.schedule.forEach(x=>{if(x.id===it.id){x.due=f.to;x.breach=false}else if(later&&x.due>row.due)x.due=addDays(x.due,shift)});
      d.extensions=[...(d.extensions||[]),{ts:Date.now(),date:today(),inst:it.id,from:row.due,to:f.to,reason:f.reason.trim()}];
      d.events=[...(d.events||[]),{ts:Date.now(),date:today(),text:`Muddat ${dmy(row.due)} → ${dmy(f.to)} ga cho‘zildi${f.reason.trim()?': '+f.reason.trim():''}`}];
      await saveDebt(d);closeSheet();render();refreshSheets();toast('Muddat cho‘zildi');
    };
  });
}

/* ---------- reminders (Android notifications) ---------- */
function hash32(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>1)%2147483000+1}
let remindT;
function rescheduleReminders(){clearTimeout(remindT);remindT=setTimeout(doReminders,600)}
async function doReminders(){
  if(!NATIVE)return;
  try{
    const LN=plug('LocalNotifications');const now=Date.now();const items=[];
    S.debts.forEach(d=>{if(d.status!=='active')return;instRows(d).forEach(it=>{if(it.left<=0)return;
      [[-3,'Nasiya muddatiga 3 kun qoldi'],[0,'Bugun nasiya to‘lov kuni']].forEach(([k,title])=>{
        const at=parseISO(addDays(it.due,k));at.setHours(9,0,0,0);if(at.getTime()<=now)return;
        items.push({id:hash32(d.id+'|'+it.id+'|'+k),title,body:`${d.client.name||'Mijoz'} · ${som(it.left)} · ${dmy(it.due)}`,schedule:{at,allowWhileIdle:true},smallIcon:'ic_stat_muhasib',extra:{debtId:d.id}})})})});
    const pend=await LN.getPending();if(pend&&pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    if(!items.length)return;
    let perm=await LN.checkPermissions();if(perm.display!=='granted')perm=await LN.requestPermissions();if(perm.display!=='granted')return;
    items.sort((a,b)=>a.schedule.at-b.schedule.at);
    await LN.schedule({notifications:items.slice(0,60)});
  }catch(e){console.warn('reminders',e)}
}
/* ---------- export: Excel ---------- */
const STATE_L=x=>x.qty<-EPS?'Kiritilmagan':x.qty<=EPS?'Tugagan':'Bor';
function typeRows(w,from,to,kind='all'){
  // one row per name + type + unit: sold in the period and remaining now
  const kOk=k=>kind==='all'||(k||'m')===kind;const m=new Map();

/* ---------- deliver files ---------- */
const CAP=window.Capacitor;const NATIVE=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform());
const plug=n=>(CAP.Plugins&&CAP.Plugins[n])||CAP.registerPlugin(n);
const b64of=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)});
async function deliverNative(files,mode){
  const FS=plug('Filesystem'),SH=plug('Share');const saved=[],uris=[];
  for(const f of files){
    const data=await b64of(f);
    if(mode==='save'){try{await FS.writeFile({path:'Muhasib/'+f.name,data,directory:'DOCUMENTS',recursive:true});saved.push(f.name);continue}catch(e){}}
    const r=await FS.writeFile({path:f.name,data,directory:'CACHE'});uris.push(r.uri);
  }
  if(uris.length){try{await SH.share({title:files.map(f=>f.name).join(', '),files:uris,dialogTitle:'Ulashish'})}catch(e){if(/cancel/i.test(String(e&&e.message)))return false}}
  if(saved.length)setTimeout(()=>toast(`Saqlandi: Documents/Muhasib/${saved.join(', ')}`),2700);
  return true;
}
async function deliver(files,mode){
  if(NATIVE)return deliverNative(files,mode);
  if(mode==='share'&&navigator.canShare){
    try{if(navigator.canShare({files})){await navigator.share({files,title:files.map(f=>f.name).join(', ')});return true}}
    catch(e){if(e&&e.name==='AbortError')return false}
  }
  for(const f of files){
    const url=URL.createObjectURL(f);const a=document.createElement('a');a.href=url;a.download=f.name;document.body.append(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},5000);await new Promise(r=>setTimeout(r,350));
  }
  return true;
}
