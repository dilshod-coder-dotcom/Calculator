<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muhāsib</title>
<meta name="theme-color" content="#1f4d3a">
<meta name="description" content="Ish joylari, xomashyo, mahsulot va sotuv hisobi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muhāsib">
<style>
/* Layout: one-column phone app. Sticky spruce top bar, scrolling view, bottom tab bar, bottom sheets for forms.
   Palette: spruce green (brand), pine-resin amber (accent / money), grain tones for photo placeholders. */
:root{
  --bg:#eef1ed; --surface:#ffffff; --surface2:#f5f7f4; --ink:#17201b; --muted:#5b6862; --line:#d8dfd9;
  --spruce:#1f4d3a; --spruce-2:#2a6650; --on-spruce:#ffffff; --pine:#b9781d; --pine-soft:#f6e8cf;
  --ok:#2e7a4e; --ok-soft:#dcefe2; --warn:#9a5d12; --warn-soft:#f8e7cc; --danger:#b23a2a; --danger-soft:#f7dcd7;
  --grain1:#dcb57d; --grain2:#c4955a; --grain-ink:#5a3a12;
  --font:"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  --r:14px; --tabh:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101513; --surface:#18201c; --surface2:#1e2723; --ink:#e5ebe7; --muted:#97a59e; --line:#2b3530;
    --spruce:#173b2d; --spruce-2:#3f8f6b; --on-spruce:#eaf3ee; --pine:#e2a54b; --pine-soft:#3a2d18;
    --ok:#5bbb84; --ok-soft:#183324; --warn:#e2a54b; --warn-soft:#3a2d18; --danger:#ec7a66; --danger-soft:#3b1f1a;
    --grain1:#8a6a3f; --grain2:#6f5230; --grain-ink:#f3dfbf;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 84px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pine);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--spruce);z-index:30}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--spruce);color:var(--on-spruce);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--pine)}
.top .logo{width:34px;height:34px;border-radius:9px;flex:none;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.top .t{min-width:0;flex:1;border:0;background:none;color:inherit;text-align:left;padding:0;cursor:pointer}
.top b{display:block;font-size:17px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{display:block;opacity:.75;font-size:12px}
.top .pill{font-size:12px;background:rgba(255,255,255,.14);border-radius:99px;padding:3px 9px;white-space:nowrap}

main{max-width:720px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{height:var(--tabh);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;min-width:0;padding:0 2px}
.tabs svg{width:24px;height:24px}
.tabs button{position:relative}
.badge{position:absolute;top:7px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font:700 11px/17px var(--font);font-style:normal}
.tabs button[aria-current="page"]{color:var(--spruce-2)}
.tabs button[aria-current="page"] svg{stroke-width:2.4}
#fab{position:fixed;z-index:21;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 14px);
  border:0;border-radius:99px;background:var(--pine);color:#1e1406;font-weight:800;font-size:16px;padding:14px 22px;box-shadow:0 6px 18px rgba(0,0,0,.22)}
@media (prefers-color-scheme:dark){#fab{color:#1e1406}}

/* blocks */
.h{font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:4px 2px -4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 14px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn.pri{background:var(--spruce-2);border-color:var(--spruce-2);color:#fff}
.btn.acc{background:var(--pine);border-color:var(--pine);color:#1e1406}
.btn.dan{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.nasiya{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.chip.karta{background:var(--surface2);color:var(--spruce-2)}

/* day switcher + summary */
.day{display:flex;align-items:center;gap:8px}
.day .arrow{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;flex:none}
.day .mid{flex:1;min-width:0;position:relative;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px;min-height:44px}
.day .mid b{display:block;font-size:15px}
.day .mid small{color:var(--muted);font-size:12px}
.day .mid input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.sum{background:var(--spruce);color:var(--on-spruce);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;
  background-image:repeating-linear-gradient(176deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px)}
.sum .big{font-size:30px;font-weight:800;line-height:1.1;letter-spacing:-.5px}
.sum .big small{font-size:15px;font-weight:600;opacity:.8;margin-left:4px}
.sum .lab{font-size:12px;opacity:.75;text-transform:uppercase;letter-spacing:.6px}
.sum .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum .grid div{background:rgba(255,255,255,.08);border-radius:10px;padding:8px 10px;min-width:0}
.sum .grid b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum .pays{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;opacity:.92}
.sum .pays .n{color:#ffb4a6;font-weight:700}

.banner{display:flex;gap:12px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:12px 14px;font-size:14px;border:0;text-align:left;width:100%}
.banner b{color:var(--ink)}

/* sale list */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;width:100%}
.item .grow div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .nm{font-weight:700}
.item .ds{font-size:13px;color:var(--muted)}
.item .rt{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.item .rt b{font-size:15px}
.thumb{width:52px;height:52px;border-radius:10px;flex:none;object-fit:cover;background:var(--surface2)}
.ph{background:repeating-linear-gradient(100deg,var(--grain1) 0 6px,var(--grain2) 6px 8px,var(--grain1) 8px 15px);display:grid;place-items:center;color:var(--grain-ink);font-weight:800;font-size:18px;overflow:hidden}
.ph.saw{background:radial-gradient(circle at 20% 30%,var(--grain2) 0 2px,transparent 3px) 0 0/9px 9px,radial-gradient(circle at 70% 60%,var(--grain2) 0 1.5px,transparent 2.5px) 0 0/7px 7px,var(--grain1)}
.empty{text-align:center;padding:28px 18px;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* products grid */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ptile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;width:100%}
.ptile .img{aspect-ratio:4/3;width:100%;max-width:100%;object-fit:cover;display:block}
.ptile .ph.img{font-size:30px;display:grid}
.ptile .bd{padding:9px 10px 11px;display:flex;flex-direction:column;gap:3px;min-width:0}
.ptile .nm{font-weight:750;line-height:1.25}
.ptile .pr{font-size:12.5px;color:var(--muted)}
.ptile .pr b{color:var(--ink);font-weight:650}
.ptile.add{align-items:center;justify-content:center;min-height:170px;border-style:dashed;color:var(--muted);font-weight:700;gap:6px;background:transparent}
.ptile.add span{font-size:34px;line-height:1;color:var(--pine)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:var(--surface2)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:800;background:var(--surface2)}

/* segmented / chips select */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:650;font-size:14px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--spruce-2);border-color:var(--spruce-2);color:#fff}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.2px}
.inp{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface2);border-radius:11px;padding:11px 12px;font-size:16px;min-height:46px}
.inp:focus{outline:2px solid var(--spruce-2);outline-offset:0;background:var(--surface)}
.inp.big{font-size:20px;font-weight:750}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.suffix{position:relative}
.suffix .inp{padding-right:52px}
.suffix span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;font-weight:700;pointer-events:none}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--danger);font-weight:650}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(8,14,11,.5);opacity:0;transition:opacity .2s}
.sheet{position:relative;width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;
  transform:translateY(100%);transition:transform .22s ease-out;display:flex;flex-direction:column;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-wrap.open .scrim{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.sh-head{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sh-head h2{margin:0;font-size:18px;flex:1;min-width:0;text-wrap:balance}
.sh-head .x{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.sh-body{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.sh-foot{position:sticky;bottom:0;background:var(--bg);padding:10px 16px 0;border-top:1px solid var(--line);display:flex;gap:10px}
.prod-head{display:flex;gap:12px;align-items:center}
.prod-head .thumb{width:60px;height:60px}
.result{background:var(--pine-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.result .q{font-size:14px;color:var(--ink)}
.result .tot{font-size:26px;font-weight:850;letter-spacing:-.4px}
.result .tot small{font-size:14px;font-weight:650;margin-left:4px;color:var(--muted)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.pick .img{aspect-ratio:1;width:100%;object-fit:cover;display:block}
.pick .ph.img{font-size:24px;display:grid}
.pick span{padding:6px 8px 8px;font-size:13px;font-weight:700;line-height:1.2}
.photo-box{display:flex;gap:12px;align-items:center}
.photo-box .thumb{width:84px;height:84px}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--spruce-2)}
.urow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.urow .check{min-width:120px}
.confirm{display:flex;flex-direction:column;gap:10px;background:var(--danger-soft);border-radius:12px;padding:12px}

/* archive */
.meter{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--spruce-2);border-radius:99px}
.mcard{display:flex;flex-direction:column;gap:10px}
.mcard .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.stk{display:flex;flex-direction:column;gap:10px}
.stk .top2{display:flex;gap:12px;align-items:center}
.stk .qv{font-size:22px;font-weight:850;letter-spacing:-.3px;line-height:1.1}
.stk .qv small{font-size:13px;font-weight:650;color:var(--muted);margin-left:3px}
.stk .acts{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.stk.low{border-color:var(--warn)}.stk.out{border-color:var(--danger)}
.qneg{color:var(--danger)}
.stockline{font-size:13.5px;border-radius:10px;padding:8px 10px;background:var(--surface);border:1px solid var(--line)}
.stockline.bad{background:var(--danger-soft);color:var(--danger);border-color:transparent;font-weight:650}
.mv{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;text-align:left}
.mv .sg{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:850;flex:none}
.mv .sg.in{background:var(--ok-soft);color:var(--ok)}.mv .sg.adj{background:var(--warn-soft);color:var(--warn)}
.untr{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.untr:last-child{border-bottom:0}
/* 1.3 */
:root{--paper:#fffdf8;--ink2:#10213a}
@media (prefers-color-scheme:dark){:root{--paper:#f4efe4}}
a.btn{color:inherit;text-decoration:none}
.person .g2{grid-template-columns:minmax(0,1fr)}
@media (min-width:520px){.person .g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.breach .btn.dan{background:var(--danger);color:#fff}
.back{align-self:flex-start;border:0;background:none;color:var(--spruce-2);font-weight:700;font-size:15px;padding:4px 2px;min-height:40px}
.menu{display:flex;flex-direction:column;gap:8px}
.mitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-height:60px}
.mitem small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.mitem.on{border-color:var(--spruce-2);box-shadow:inset 3px 0 0 var(--spruce-2)}
.btn.sm{min-height:36px;padding:6px 11px;font-size:13.5px;border-radius:10px}
.req{color:var(--danger)}
.person{display:flex;flex-direction:column;gap:7px}
.person .lbl{font-size:12.5px;font-weight:700;color:var(--muted)}
.pbtns{display:flex;flex-wrap:wrap;gap:8px}
.sug{display:flex;flex-wrap:wrap;gap:6px}
.sug:empty{display:none}
.sug .chip{cursor:pointer;font-size:12.5px;padding:6px 10px;background:var(--surface)}
.block{display:flex;flex-direction:column;gap:10px}
.sub{display:flex;flex-direction:column;gap:12px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.card-pay{padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.card-pay .lbl,.disc .lbl{font-size:12.5px;font-weight:700;color:var(--muted)}
.photo-row{display:flex;gap:12px;align-items:center}
.ph-prev{width:84px;height:84px;border-radius:12px;object-fit:cover;flex:none;background:var(--surface2);border:1px solid var(--line)}
.ph-prev.none{display:grid;place-items:center;color:var(--muted)}
.sigpad{width:100%;max-width:100%;height:140px;touch-action:none;background:var(--paper);border:1.5px dashed var(--line);border-radius:12px;display:block}
.sigdone{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.sigdone img{height:56px;width:auto;flex:1;min-width:0;object-fit:contain;object-position:left}
.disc{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.dchip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 11px;font-weight:700;font-size:14px;min-height:40px;font-variant-numeric:tabular-nums}
.dchip[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#1e1406}
.dchip.add{border-style:dashed;color:var(--muted);font-weight:650}
.seg.mini button{min-height:32px;padding:4px 10px;font-size:12.5px}
.result .dl{color:var(--warn);font-weight:650}
.dtag{color:var(--warn);font-weight:700}
.note-n{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px}
.okc{color:var(--ok);font-weight:650}
.hint.bad,.bad{color:var(--danger);font-weight:650}
.banner.red{background:var(--danger-soft);color:var(--danger)}
.ayah{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;border-top:3px solid var(--pine)}
.ayah .ar{margin:0;font-family:"Amiri","Noto Naskh Arabic","Scheherazade New","Traditional Arabic",serif;font-size:21px;line-height:1.9;text-align:right}
.ayah .uz{margin:0;font-size:14px;font-style:italic}
.ayah small{color:var(--muted);font-size:12px}
.ayah.compact .ar{font-size:18px;line-height:1.7}
.ayah.compact .uz{font-size:13px}
.rules{display:flex;flex-direction:column;gap:10px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.rule dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0;font-size:13.5px}
.rule dt{color:var(--muted)}.rule dd{margin:0;font-weight:600}
.contract .csec{display:flex;flex-direction:column;gap:12px;padding-top:6px;border-top:1px solid var(--line)}
.contract h3{margin:4px 0 0;font-size:15px;letter-spacing:.2px}
.sched{display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}

<script>
(()=>{'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const UNITS={m3:{l:'m³',n:'kub metr',d:4},m2:{l:'m²',n:'kvadrat metr',d:2},pm:{l:'p.m',n:'pogon metr',d:2},dona:{l:'dona',n:'dona',d:2},kg:{l:'kg',n:'kilogramm',d:2},qop:{l:'qop',n:'qop',d:2}};
const UORDER=['m3','m2','pm','dona','kg','qop'];
const CATS=['Taxta','Shpunt','Reyka','Plintus','Skameyka taxtasi','Apilka / Palaxta','Boshqa'];
const PAYS={naqd:'Naqd',karta:'Karta',nasiya:'Nasiya'};
const MONTHS=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
const WDAYS=['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];

const num=v=>{if(v===null||v===undefined)return NaN;const s=String(v).replace(/[\s ]/g,'').replace(',','.');return s===''?NaN:Number(s)};
const pos=v=>{const n=num(v);return isFinite(n)&&n>0?n:0};
const sp=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const som=n=>sp(Math.round(n||0))+" so'm";
const fq=(n,d=3)=>{n=+n||0;if(!n)return '0';let s=n.toFixed(d);if(s.includes('.'))s=s.replace(/0+$/,'').replace(/\.$/,'');const [a,b]=s.split('.');return sp(a)+(b?','+b:'')};
const fqu=(n,u)=>fq(n,UNITS[u]?UNITS[u].d||0:2)+' '+(UNITS[u]?UNITS[u].l:u);
const r4=n=>Math.round((+n||0)*1e4)/1e4;

const isoDate=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>isoDate(new Date());
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return isoDate(d)};
const dmy=s=>{const [y,m,d]=s.split('-');return `${d}.${m}.${y}`};
const mKey=s=>s.slice(0,7);
const mLabel=k=>{const [y,m]=k.split('-');return `${MONTHS[+m-1]} ${y}`};
const dayLabel=s=>{const d=parseISO(s);return `${d.getDate()}-${MONTHS[d.getMonth()].toLowerCase()}`};
const wday=s=>WDAYS[parseISO(s).getDay()];
const nowTime=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};

let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---------- storage (IndexedDB) ---------- */
const DB={db:null,mem:null,
  open(){return new Promise(res=>{
    const MEM=()=>({products:new Map(),sales:new Map(),meta:new Map(),moves:new Map(),clients:new Map(),debts:new Map(),items:new Map(),ops:new Map()});
    let r;try{r=indexedDB.open('calculator-yogoch',4)}catch(e){this.mem=MEM();return res(false)}
    r.onupgradeneeded=e=>{const db=r.result,o=e.oldVersion||0;
      if(o<1){db.createObjectStore('products',{keyPath:'id'});const s=db.createObjectStore('sales',{keyPath:'id'});s.createIndex('date','date');db.createObjectStore('meta',{keyPath:'k'})}
      if(o<2){db.createObjectStore('moves',{keyPath:'id'})}
      if(o<3){db.createObjectStore('clients',{keyPath:'id'});db.createObjectStore('debts',{keyPath:'id'})}
      if(o<4){db.createObjectStore('items',{keyPath:'id'});const p=db.createObjectStore('ops',{keyPath:'id'});p.createIndex('date','date')}};
    r.onsuccess=()=>{this.db=r.result;res(true)};
    r.onerror=()=>{this.mem=MEM();res(false)};
  })},
  key(store,v){return store==='meta'?v.k:v.id},
  tx(store,mode,fn){
    if(this.mem){return Promise.resolve(fn(null))}
    return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const s=t.objectStore(store);let out;const q=fn(s);if(q&&'onsuccess' in q)q.onsuccess=()=>{out=q.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('abort'))})},
  all(store){return this.mem?Promise.resolve([...this.mem[store].values()]):this.tx(store,'readonly',s=>s.getAll())},
  put(store,v){if(this.mem){this.mem[store].set(this.key(store,v),v);return Promise.resolve()}return this.tx(store,'readwrite',s=>s.put(v))},
  putMany(store,vals){if(!vals.length)return Promise.resolve();if(this.mem){vals.forEach(v=>this.mem[store].set(this.key(store,v),v));return Promise.resolve()}return this.tx(store,'readwrite',s=>{vals.forEach(v=>s.put(v))})},
  del(store,k){if(this.mem){this.mem[store].delete(k);return Promise.resolve()}return this.tx(store,'readwrite',s=>s.delete(k))},
  delMany(store,keys){if(!keys.length)return Promise.resolve();if(this.mem){keys.forEach(k=>this.mem[store].delete(k));return Promise.resolve()}return this.tx(store,'readwrite',s=>{keys.forEach(k=>s.delete(k))})},
};

// products/sales/moves are the 1.4 stores: read once to migrate, then left untouched as a safety copy
const S={items:[],ops:[],products:[],sales:[],moves:[],clients:[],debts:[],wps:[],wp:'all',cw:'',meta:{},view:'home',dFilter:'active',
  showSums:false,rep:{preset:'month',from:'',to:'',wp:'all',kind:'all',hist:'all'},wpPer:'today',wpTab:'x'};
const prod=id=>S.products.find(p=>p.id===id);
const setMeta=(k,v)=>{S.meta[k]=v;return DB.put('meta',{k,v})};

/* ---------- workplaces (ish joylari) ---------- */
const wpOf=x=>(x&&x.wp)||'w1';
const wpById=id=>S.wps.find(w=>w.id===id);
const wpName=id=>(wpById(id)||{name:'—'}).name;
const multiWp=()=>S.wps.length>1;
const inWp=(x,w=S.wp)=>w==='all'||wpOf(x)===w;
const curWp=()=>S.cw&&wpById(S.cw)?S.cw:S.wps[0].id;
const scopeLabel=()=>S.wp==='all'?(multiWp()?`Barcha ish joylari (${S.wps.length})`:S.wps[0].name):wpName(S.wp);
async function saveWps(){await setMeta('workplaces',S.wps)}
const wpField=(f,key='wp',label='Ish joyi')=>`<div class="field"><span class="lbl">${label}</span><div class="seg" role="group">${S.wps.map(w=>`<button type="button" data-wpf-${key}="${w.id}" aria-pressed="${f[key]===w.id}">${esc(w.name)}</button>`).join('')}</div></div>`;
const bindWpField=(c,f,after,key='wp')=>$$(`[data-wpf-${key}]`,c).forEach(b=>b.onclick=()=>{f[key]=b.getAttribute(`data-wpf-${key}`);$$(`[data-wpf-${key}]`,c).forEach(x=>x.setAttribute('aria-pressed',x===b));after&&after()});
const defaultWpName=i=>`${i+1}-ish joyi`;

/* ---------- names (kategoriyalar) and stock items ---------- */
const DEF_CATS=['Taxta','Shpunt','Plintus','Reyka','Vassa','Skameyka','DVP','DSP','Vogonka'];
const KIND={x:'Xomashyo',m:'Mahsulot'};
const catsList=()=>Array.isArray(S.meta.cats)&&S.meta.cats.length?S.meta.cats:DEF_CATS;
const sameN=(a,b)=>String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase();
const xarOf=(tur,size)=>[tur,size].map(s=>String(s||'').trim()).filter(Boolean).join(' · ');
const itemKey=x=>[x.wp,x.k,String(x.name||'').trim().toLowerCase(),String(x.xar||'').trim().toLowerCase(),x.unit].join('|');
const itemById=id=>S.items.find(x=>x.id===id);
const EPS=1e-9;
const live=x=>Math.abs(x.qty)>EPS;
const itemsOf=(w,k)=>S.items.filter(x=>live(x)&&(w==='all'||x.wp===w)&&(!k||k==='all'||x.k===k));
const stockSum=list=>Math.round(list.reduce((a,x)=>a+(x.qty>0?x.qty*(+x.price||0):0),0));
const lastUnit=(name,def)=>{const f=S.items.filter(x=>sameN(x.name,name)).sort((a,b)=>(b.updated||0)-(a.updated||0))[0];return f?f.unit:def};
const typesOf=(name,w,k)=>{const m=new Map();S.items.filter(x=>sameN(x.name,name)&&(!w||x.wp===w)&&(!k||x.k===k)).forEach(x=>{const key=(x.xar||'').toLowerCase()+'|'+x.unit;if(!m.has(key))m.set(key,x)});return [...m.values()]};

// apply stock changes: each {wp,k,name,tur,size,xar,unit,dq,price}; merges by name + type + unit inside one workplace
async function applyStock(changes){
  const touched=new Map();
  for(const c of changes){
    const xar=c.xar!=null?c.xar:xarOf(c.tur,c.size);
    const probe={wp:c.wp,k:c.k,name:c.name,xar,unit:c.unit};const key=itemKey(probe);
    let it=(c.itemId&&itemById(c.itemId)&&itemKey(itemById(c.itemId))===key)?itemById(c.itemId):S.items.find(x=>itemKey(x)===key);
    if(it){it.qty=r4(it.qty+c.dq);if(pos(c.price)&&c.setPrice!==false)it.price=Math.round(pos(c.price));it.updated=Date.now()}
    else{it={id:uid('i'),wp:c.wp,k:c.k,name:String(c.name).trim(),tur:String(c.tur||'').trim(),size:String(c.size||'').trim(),xar,unit:c.unit,qty:r4(c.dq),price:Math.round(pos(c.price)),created:Date.now(),updated:Date.now()};S.items.push(it)}
    c.itemId=it.id;touched.set(it.id,it);
  }
  await DB.putMany('items',[...touched.values()]);
  return changes;
}
const lineOf=(x,q,extra={})=>({itemId:x.id,wp:x.wp,k:x.k,name:x.name,tur:x.tur||'',size:x.size||'',xar:x.xar||'',unit:x.unit,q:r4(q),price:Math.round(+x.price||0),...extra});
async function saveOp(op){await DB.put('ops',op);const i=S.ops.findIndex(x=>x.id===op.id);if(i>=0)S.ops[i]=op;else S.ops.push(op)}
// stock effect of an operation (sign +1 = apply, -1 = undo)
function opEffects(o,sign){
  const ch=[];const L=(l,wp,dq)=>ch.push({itemId:l.itemId,wp,k:l.k,name:l.name,tur:l.tur,size:l.size,xar:l.xar,unit:l.unit,dq:sign*dq,price:l.price,setPrice:false});
  if(o.kind==='in'||o.kind==='adj')o.lines.forEach(l=>L(l,l.wp||o.wp,l.q));
  else if(o.kind==='sale')o.lines.forEach(l=>L(l,l.wp||o.wp,-l.q));
  else if(o.kind==='make'){(o.used||[]).forEach(l=>L(l,l.wp,-l.q));o.lines.forEach(l=>L(l,l.wp||o.wp,l.q))}

/* ---------- 1.4 stock math (used only to migrate old data) ---------- */
function hasDims(p){return pos(p.t)&&pos(p.w)&&pos(p.l)}
function describe(s){
  if(s.mode==='kuzov')return `Kuzov ${fq(s.a,2)}×${fq(s.b,2)}×${fq(s.c,2)} m`;
  if(s.mode==='pieces'){const d=[s.t&&fq(s.t,1),s.w&&fq(s.w,1)].filter(Boolean).join('×');return `${sp(s.n)} dona`+(d?` · ${d} mm`:'')+(pos(s.l)?` × ${fq(s.l,2)} m`:'')}

}
/* ---------- stock (qoldiq) ---------- */
// best-known amounts of one record (sale or stock move) in every unit, using product dimensions
function measures(rec,p){
  p=p||{};const t=pos(p.t),w=pos(p.w),l=pos(p.l),q=pos(p.qopM3);
  let m3=rec.unit==='m3'?pos(rec.qty):pos(rec.m3),m2=rec.unit==='m2'?pos(rec.qty):pos(rec.m2),pm=rec.unit==='pm'?pos(rec.qty):pos(rec.pm);
  let dona=rec.unit==='dona'?pos(rec.qty):(rec.mode==='pieces'?pos(rec.n):0),qop=rec.unit==='qop'?pos(rec.qty):0;
  if(!m3&&qop&&q)m3=qop*q;
  if(!m3&&dona&&t&&w&&l)m3=dona*t*w*l/1e6;
  if(!m3&&m2&&t)m3=m2*t/1000;
  if(!m3&&pm&&t&&w)m3=pm*t*w/1e6;
  if(!m2&&m3&&t)m2=m3*1000/t;
  if(!m2&&pm&&w)m2=pm*w/1000;
  if(!pm&&m2&&w)pm=m2*1000/w;
  if(!dona&&m3&&t&&w&&l)dona=m3/(t*w*l/1e6);
  if(!qop&&m3&&q)qop=m3/q;

}
function toUnit(rec,unit,p){if(!pos(rec.qty))return 0;if(rec.unit===unit)return pos(rec.qty);const v=measures(rec,p)[unit];return v>0?v:null}
function sgnTo(fromUnit,val,unit,p){val=+val||0;if(!val)return 0;const x=toUnit({unit:fromUnit,qty:Math.abs(val)},unit,p);return x==null?null:Math.sign(val)*x}
const tracked=p=>!!(p&&p.stockUnit);
const saleCounts=(s,p)=>s.productId===p.id&&(s.ts||0)>=((p.stockFromBy&&p.stockFromBy[wpOf(s)])??(p.stockFrom||0));
const moveVal=(m,p)=>{const x=toUnit(m,p.stockUnit,p);return x==null?null:x*(m.sign||1)};
const baseOne=(p,b)=>b?(sgnTo(b.unit||p.stockUnit,b.val||0,p.stockUnit,p)||0):0;
const baseVal=(p,w=S.wp)=>{const bs=p.stockBases||{};return w==='all'?Object.values(bs).reduce((a,b)=>a+baseOne(p,b),0):baseOne(p,bs[w])};
const setBase=(p,w,val)=>{p.stockBases={...(p.stockBases||{}),[w]:{unit:p.stockUnit,val:r4(val)}}};
function stockOf(p,upto,w=S.wp){
  if(!tracked(p))return null;
  const u=p.stockUnit,base=baseVal(p,w);let inn=0,out=0,adj=0,skip=0;
  S.moves.forEach(m=>{if(m.productId!==p.id||!inWp(m,w)||(upto&&m.date>upto))return;const x=moveVal(m,p);if(x==null){skip++;return}if(m.type==='in')inn+=x;else adj+=x});
  S.sales.forEach(s=>{if(!saleCounts(s,p)||!inWp(s,w)||(upto&&s.date>upto))return;const x=toUnit(s,u,p);if(x==null){skip++;return}out+=x});
  return {u,base,inn,out,adj,skip,val:r4(base+inn+adj-out)};
}
function periodStock(p,from,to,w=S.wp){const a=stockOf(p,addDays(from,-1),w),b=stockOf(p,to,w),n=stockOf(p,null,w);
  return {p,u:p.stockUnit,open:a.val,inn:r4(b.inn-a.inn),out:r4(b.out-a.out),adj:r4(b.adj-a.adj),close:b.val,now:n.val,skip:n.skip}}
function stockState(p,st){if(!st)return null;const min=pos(p.minStock);if(st.val<=0)return 'out';if(min&&st.val<=min)return 'low';return 'ok'}
const STATE_CHIP={out:'<span class="chip nasiya">Tugagan</span>',low:'<span class="chip warn">Kam qoldi</span>',ok:'<span class="chip ok">Bor</span>'};
function approxPieces(p,st){if(!st||p.stockUnit==='dona'||st.val<=0)return '';const d=measures({unit:p.stockUnit,qty:st.val},p).dona;return d?`≈ ${sp(Math.floor(d+1e-6))} dona`:''}
// sale price for one stock unit (converted from another priced unit through the product's dimensions)
function stockPrice(p){
  if(!tracked(p))return 0;const u=p.stockUnit;const d=pos(p.prices&&p.prices[u]);if(d)return d;
  for(const k of Object.keys(p.prices||{})){const pk=pos(p.prices[k]);if(!pk||!UNITS[k])continue;const amt=toUnit({unit:u,qty:1,mode:'direct'},k,p);if(amt)return pk*amt}

const stockValue=(p,w=S.wp)=>{const st=stockOf(p,null,w);return st?Math.round(Math.max(0,st.val)*stockPrice(p)):0};
function soldOf(p,from,to,w=S.wp){let qty=0,sum=0,n=0;
  S.sales.forEach(s=>{if(s.productId!==p.id||!inWp(s,w)||s.date<from||s.date>to)return;n++;sum+=s.total;if(tracked(p)){const x=toUnit(s,p.stockUnit,p);if(x)qty+=x}});
  return {qty:r4(qty),sum:Math.round(sum),n}}
function wpStockSummary(from,to){
  return S.wps.map(w=>({id:w.id,name:w.name,manager:w.manager,value:S.products.filter(tracked).reduce((a,p)=>a+stockValue(p,w.id),0),
    sold:Math.round(S.sales.filter(s=>wpOf(s)===w.id&&s.date>=from&&s.date<=to).reduce((a,s)=>a+s.total,0))}));
}
/* ---------- 1.4 -> 1.5: products + sales + stock moves become stock items and operations ---------- */
const LEGACY_NAME={'Skameyka taxtasi':'Skameyka'};
function legacyConvert(products,sales,moves,wps){
  const bak=[S.products,S.sales,S.moves];S.products=products;S.sales=sales;S.moves=moves;
  try{
    const pmap=new Map();products.forEach(p=>pmap.set(p.id,p));
    const nameOf=p=>{const c=String(p.cat||'');if(/apilka|palaxta/i.test(c+' '+p.name))return p.name;if(c&&c!=='Boshqa')return LEGACY_NAME[c]||c;return p.name};
    const kindOf=p=>/^taxta$/i.test(nameOf(p))?'x':'m';
    const sizeOf=p=>hasDims(p)?`${fq(p.t,1)}×${fq(p.w,1)} mm × ${fq(p.l,2)} m`:'';
    const turOf=p=>sameN(p.name,nameOf(p))?'':p.name;
    const desc=p=>({k:kindOf(p),name:nameOf(p),tur:turOf(p),size:sizeOf(p),xar:xarOf(turOf(p),sizeOf(p))});
    const items=[],imap=new Map();
    products.forEach(p=>{if(!tracked(p))return;const d=desc(p);const pr=Math.round(stockPrice(p));
      wps.forEach(w=>{const st=stockOf(p,null,w.id);if(!st||Math.abs(st.val)<EPS)return;
        const it={id:uid('i'),wp:w.id,...d,unit:p.stockUnit,qty:r4(st.val),price:pr,created:Date.now(),updated:Date.now(),from14:p.id};items.push(it);imap.set(p.id+'|'+w.id,it)})});
    const ops=[];
    sales.forEach(s=>{const p=pmap.get(s.productId)||{name:s.productName,cat:''};const d=desc(p);const w=wpOf(s);const it=imap.get(s.productId+'|'+w);
      ops.push({id:s.id,ts:s.ts||Date.now(),date:s.date,kind:'sale',wp:w,legacy:1,
        lines:[{itemId:it?it.id:'',wp:w,...d,unit:s.unit,q:r4(s.qty),price:Math.round(s.disc?s.disc.unitPrice:s.price),gross:Math.round(s.calc||s.total),sum:Math.round(s.total),how:describe(s)}],
        sub:Math.round(s.calc||s.total),disc:s.disc?{kind:s.disc.kind,v:s.disc.v,amount:s.disc.amount}:null,total:Math.round(s.total),pay:s.pay||'naqd',
        client:s.client||'',phone:s.phone||'',clientId:s.clientId||'',card:s.card||null,dlv:s.dlv||null,note:s.note||''})});
    moves.forEach(m=>{const p=pmap.get(m.productId)||{name:m.productName,cat:''};const d=desc(p);const w=wpOf(m);const it=imap.get(m.productId+'|'+w);
      ops.push({id:m.id,ts:m.ts||Date.now(),date:m.date,kind:m.type==='adj'?'adj':'in',wp:w,legacy:1,note:m.note||'',
        lines:[{itemId:it?it.id:'',wp:w,...d,unit:m.unit,q:r4((m.sign||1)*m.qty),price:0,cost:m.cost||0}]})});
    return {items,ops};
  }finally{[S.products,S.sales,S.moves]=bak}
}

async function load(){
  const ok=await DB.open();
  if(!ok)setTimeout(()=>toast("Diqqat: xotira ochilmadi, ma'lumot saqlanmaydi"),600);
  S.items=await DB.all('items');S.ops=await DB.all('ops');S.clients=await DB.all('clients');S.debts=await DB.all('debts');
  (await DB.all('meta')).forEach(x=>S.meta[x.k]=x.v);
  const fresh=!Array.isArray(S.meta.workplaces)||!S.meta.workplaces.length;
  S.wps=fresh?[]:S.meta.workplaces;
  if(!S.meta.v15){
    S.products=await DB.all('products');S.sales=await DB.all('sales');S.moves=await DB.all('moves');
    if(fresh&&(S.sales.length||S.moves.length))S.wps=[{id:'w1',name:S.meta.shop||'Asosiy',manager:'',phone:'',addr:''}];
    S.products.forEach(p=>{if(p.stockBase&&!p.stockBases){p.stockBases={w1:p.stockBase};delete p.stockBase}});
    if(S.sales.length||S.moves.length||S.products.some(tracked)){
      const r=legacyConvert(S.products,S.sales,S.moves,S.wps.length?S.wps:[{id:'w1'}]);
      await DB.putMany('items',r.items);await DB.putMany('ops',r.ops);S.items.push(...r.items);S.ops.push(...r.ops);
      await setMeta('migrated14',Date.now());
    }
    await setMeta('v15',1);S.products=[];S.sales=[];S.moves=[];
  }
  while(S.wps.length<4){const n=S.wps.length+1;const id=S.wps.some(w=>w.id==='w'+n)?uid('w'):'w'+n;S.wps.push({id,name:defaultWpName(n-1),manager:'',phone:'',addr:''})}
  await saveWps();
  if(!Array.isArray(S.meta.cats))await setMeta('cats',DEF_CATS.slice());
  S.debts.sort((a,b)=>(b.ts||0)-(a.ts||0));
}

async function compress(file,max=480,q=0.72){
  let src;
  try{src=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){
    src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});
  }
  const w=src.width,h=src.height,k=Math.min(1,max/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',q);
}

function render(){

  ({home:vHome,wp:vWp,nasiya:vNasiya,report:vReport,more:vMore,clients:vClients,wps:vWps,cards:vCards,cats:vCats,archive:vArchive})[S.view]();

function openMonthsBefore(k){
  const m=new Map();S.ops.forEach(o=>{const mk=mKey(o.date);if(mk<k)m.set(mk,(m.get(mk)||0)+1)});
  return [...m.entries()].sort();
}
function alertsHTML(w){
  const negs=S.items.filter(x=>x.qty<-EPS&&(!w||x.wp===w));
  const dd=S.debts.filter(d=>d.status!=='closed'&&(!w||d.wp===w)),dDue=dd.filter(d=>['due','breached'].includes(debtState(d))),dSoon=dd.filter(d=>debtState(d)==='soon'),dDraft=dd.filter(d=>debtState(d)==='draft');
  const old=w?[]:openMonthsBefore(mKey(today()));
  return [
    negs.length?`<button class="banner" type="button" data-neg="${negs[0].wp}"><span class="grow"><b>Kiritilmagan:</b> ${negs.length} ta tovar sotilgan, lekin omborga kiritilmagan — ${negs.slice(0,3).map(x=>esc(x.name)+' '+fqu(x.qty,x.unit)+(w?'':' ('+esc(wpName(x.wp))+')')).join(', ')}${negs.length>3?' …':''}</span><span aria-hidden="true">›</span></button>`:'',
    dDue.length||dSoon.length||dDraft.length?`<button class="banner ${dDue.length?'red':''}" type="button" data-go="nasiya"><span class="grow"><b>Nasiya:</b> ${[dDue.length?`${dDue.length} tasining muddati keldi`:'',dSoon.length?`${dSoon.length} tasiga 3 kun qoldi`:'',dDraft.length?`${dDraft.length} ta shartnoma to‘ldirilmagan`:''].filter(Boolean).join(', ')}</span><span aria-hidden="true">›</span></button>`:'',
    old.length?`<button class="banner" type="button" data-go="archive"><span class="grow"><b>${esc(old.map(o=>mLabel(o[0])).join(', '))}</b> yopilmagan (${sp(old.reduce((a,o)=>a+o[1],0))} ta yozuv). Faylga saqlab, telefon xotirasini bo'shating.</span><span aria-hidden="true">›</span></button>`:'',

}

  if(!isNew&&/^\d+-ish joyi$/.test(f.name))f.name='';

    const c=api.content;const used=!isNew&&(S.items.some(x=>x.wp===f.id&&live(x))||S.ops.some(o=>opWps(o).includes(f.id))||S.debts.some(d=>wpOf(d)===f.id));
    c.innerHTML=`<div class="sh-body">
      <div class="field"><label for="wName">Nomi</label><input class="inp" id="wName" value="${esc(f.name)}" placeholder="${esc(w0?w0.name:'Masalan: Asosiy ombor, 1-sex, Do‘kon')}" autocomplete="off"></div>
      ${personHTML('wm','Ish boshqaruvchisi',f.manager,f.phone)}
      <div class="field"><label for="wAddr">Manzil (shartnomalarda chiqadi)</label><input class="inp" id="wAddr" value="${esc(f.addr||'')}" placeholder="Shahar, tuman, ko‘cha" autocomplete="off"></div>
      <div class="err" id="wErr" hidden></div>
      ${!isNew&&S.wps.length>1?(used?`<p class="hint">Bu ish joyida yozuvlar bor, shuning uchun o‘chirib bo‘lmaydi.</p>`:`<button class="btn dan" type="button" id="wDel">Ish joyini o‘chirish</button>`):''}
    </div><div class="sh-foot"><button class="btn pri block" type="button" id="wSave">Saqlash</button></div>`;
    $('#wName',c).oninput=e=>{f.name=e.target.value};$('#wAddr',c).oninput=e=>{f.addr=e.target.value};
    bindPerson(c,'wm',f,'manager','phone',{role:'manager'});
    $('#wSave',c).onclick=async()=>{
      const name=f.name.trim()||(w0?w0.name:'');
      if(!name){const e=$('#wErr',c);e.textContent='Ish joyi nomini yozing.';e.hidden=false;return}
      const rec={...f,name,manager:String(f.manager||'').trim(),phone:normPhone(f.phone),addr:String(f.addr||'').trim()};
      const i=S.wps.findIndex(x=>x.id===rec.id);if(i>=0)S.wps[i]=rec;else S.wps.push(rec);
      await saveWps();closeSheet();render();toast(isNew?'Ish joyi qo‘shildi':'Saqlandi');

  });
}

/* ---------- report ---------- */
function notEntered(w,from,to){
  // items with a minus balance (sold before they were entered), with what was sold in the period
  return S.items.filter(x=>x.qty<-EPS&&(w==='all'||x.wp===w)).map(x=>{
    let q=0,s=0;salesIn(from,to,x.wp).forEach(o=>o.lines.forEach(l=>{if(sameN(l.name,x.name)&&sameN(l.xar,x.xar)&&l.unit===x.unit&&(l.k||'m')===x.k){q+=l.q;s+=+l.sum||0}}));
    return {x,q:r4(q),s:Math.round(s)}});
}
function wpRows(from,to){return S.wps.map(w=>{const t=payTotals(salesIn(from,to,w.id));return {w,t,x:stockSum(itemsOf(w.id,'x')),m:stockSum(itemsOf(w.id,'m'))}})}
function histOps(from,to,w,type){
  return S.ops.filter(o=>o.date>=from&&o.date<=to&&(w==='all'||opWps(o).includes(w))&&(type==='all'||o.kind===type||(type==='in'&&o.kind==='adj')));
}
function vReport(){

  const sales=sortOps(salesIn(from,to,W)),T=payTotals(sales);
  const NE=notEntered(W,from,to),R=catRows(W,from,to,S.rep.kind),WR=W==='all'?wpRows(from,to):null;
  const NS=nasiyaSummaryW(from,to,W);
  const H=histOps(from,to,W,S.rep.hist).sort((a,b)=>a.date===b.date?(b.ts||0)-(a.ts||0):(a.date<b.date?1:-1));
  const has=sales.length||H.length||S.items.some(live);
  const P=[['today','Bugun'],['week','Bu hafta'],['month','Bu oy'],['prev',"O'tgan oy"],['year','Bu yil'],['custom','Sanadan sanagacha']];
  $('#view').innerHTML=`<div class="seg" role="group" aria-label="Davr">${P.map(p=>`<button type="button" data-pr="${p[0]}" aria-pressed="${S.rep.preset===p[0]}">${p[1]}</button>`).join('')}</div>
  ${S.rep.preset==='custom'?`<div class="g2"><div class="field"><label for="rFrom">Sanadan</label><input class="inp" type="date" id="rFrom" value="${from}"></div><div class="field"><label for="rTo">Sanagacha</label><input class="inp" type="date" id="rTo" value="${to}"></div></div>`:''}
  <div class="field"><span class="lbl">Ish joyi</span><div class="seg" role="group"><button type="button" data-rw="all" aria-pressed="${W==='all'}">Hammasi</button>${S.wps.map(w=>`<button type="button" data-rw="${w.id}" aria-pressed="${W===w.id}">${esc(w.name)}</button>`).join('')}</div></div>
  <section class="sum"><div><div class="lab">${esc(label)} · ${W==='all'?'barcha ish joylari':esc(wpName(W))}</div><div class="big num">${sp(Math.round(T.sum))}<small>so'm</small></div></div>
    <div class="grid num"><div><span class="lab">Cheklar</span><b>${T.n} ta</b></div><div><span class="lab">Xomashyo sotuvi</span><b>${sp(Math.round(T.x))}</b></div><div><span class="lab">Mahsulot sotuvi</span><b>${sp(Math.round(T.m))}</b></div></div>
    <div class="pays num"><span>Naqd: ${som(T.pay.naqd)}</span><span>Karta: ${som(T.pay.karta)}</span><span class="${T.pay.nasiya?'n':''}">Nasiya: ${som(T.pay.nasiya)}</span></div></section>
  <div class="g2"><button class="btn pri" type="button" id="xX" ${has?'':'disabled'}>Excel (.xlsx)</button><button class="btn acc" type="button" id="xP" ${has?'':'disabled'}>PDF hisobot</button></div>
  <button class="btn" type="button" id="xS" ${has?'':'disabled'}>Ikkalasini ulashish (Telegram, Drive…)</button>

function nasiyaSummaryW(from,to,w){
  const ds=S.debts.filter(d=>(w==='all'||wpOf(d)===w)&&d.status!=='draft');let got=0;
  ds.forEach(d=>{(d.payments||[]).forEach(p=>{if(p.date>=from&&p.date<=to)got+=+p.amount||0})});
  const open=ds.filter(d=>debtLeft(d)>0);
  const late=open.reduce((a,d)=>a+instRows(d).filter(x=>x.left>0&&(x.st==='overdue'||x.st==='breach')).reduce((s,x)=>s+x.left,0),0);
  return {got,left:open.reduce((a,d)=>a+debtLeft(d),0),count:open.length,late,list:ds};

async function storageInfo(){

  }catch(err){}
}

function periodOf(pr){
  const td=today(),d=parseISO(td);
  if(pr==='today')return [td,td,'Bugun, '+dmy(td)];
  if(pr==='week'){const k=(d.getDay()+6)%7;const f=addDays(td,-k);return [f,td,`${dmy(f)} – ${dmy(td)}`]}
  if(pr==='month'){const f=td.slice(0,8)+'01';return [f,td,mLabel(mKey(td))]}
  if(pr==='year'){const f=td.slice(0,4)+'-01-01';return [f,td,td.slice(0,4)+'-yil']}
  if(pr==='prev'){const p=new Date(d.getFullYear(),d.getMonth()-1,1);const f=isoDate(p);const l=isoDate(new Date(d.getFullYear(),d.getMonth(),0));return [f,l,mLabel(mKey(f))]}
  const f=S.rep.from||td.slice(0,8)+'01',t=S.rep.to||td;return [f,t,`${dmy(f)} – ${dmy(t)}`];
}
const slug=s=>String(s||'').replace(/[^\p{L}\p{N}]+/gu,'_').replace(/^_|_$/g,'').slice(0,24);

const unitSeg=(key,cur)=>`<div class="seg mini" role="group" aria-label="O‘lchov birligi">${UORDER.map(u=>`<button type="button" data-${key}="${u}" aria-pressed="${cur===u}">${UNITS[u].l}</button>`).join('')}</div>`;
const typeChips=(key,list)=>list.length?`<div class="field"><span class="lbl">Bor turlar — bosib tanlang</span><div class="chips">${list.map(x=>`<button type="button" class="dchip" data-${key}="${x.id}">${esc(x.xar||'turi ko‘rsatilmagan')} · ${UNITS[x.unit].l}${x.price?' · '+sp(x.price):''}</button>`).join('')}</div></div>`:'';
const newNameRow=id=>`<div class="row"><input class="inp grow" id="${id}" placeholder="Ro‘yxatda yo‘q nom…" autocomplete="off" aria-label="Yangi nom"><button class="btn sm" type="button" id="${id}B">+ Nom</button></div>`;
function bindNewName(c,id,onAdd){$('#'+id+'B',c).onclick=async()=>{const v=$('#'+id,c).value.trim();if(!v)return;const cs=catsList();const ex=cs.find(x=>sameN(x,v));if(!ex)await setMeta('cats',[...cs,v]);onAdd(ex||v)}}

/* ---------- kirim (xomashyo yoki tayyor mahsulot) ---------- */
function kirimSheet(wp){
  const f={wp:wp||curWp(),k:'x',cat:null,tur:'',size:'',unit:'m3',qty:'',price:'',date:today(),added:[]};
  openSheet('Kiritish',api=>{
    const c=api.content;
    const draw=()=>{
      c.innerHTML=`<div class="sh-body">
        ${wpField(f)}
        <div class="seg tabs2" role="group"><button type="button" data-kk="x" aria-pressed="${f.k==='x'}">Xomashyo</button><button type="button" data-kk="m" aria-pressed="${f.k==='m'}">Tayyor mahsulot</button></div>
        ${f.k==='m'?'<div class="hint">Tayyor mahsulot qoldig‘i xomashyo sarflamasdan to‘g‘ridan-to‘g‘ri kiritiladi — dasturni ishlata boshlaganda bor qoldiqlarni yozish uchun.</div>':''}
        <div class="field"><span class="lbl">Nomi — bosing</span>${catGrid('kc',f.cat)}</div>
        ${newNameRow('kNew')}
        ${f.cat?`<div class="card xc">
          <div class="xh"><b>${esc(f.cat)}</b><span>Xarakteristikasi = turi + o‘lchami + soni + narxi</span></div>
          ${typeChips('kt',typesOf(f.cat,f.wp,f.k))}
          <div class="g2"><div class="field"><label for="kTur">Turi</label><input class="inp" id="kTur" value="${esc(f.tur)}" placeholder="Masalan: qarag‘ay, 1-nav" autocomplete="off"></div>
            <div class="field"><label for="kSize">O‘lchami</label><input class="inp" id="kSize" value="${esc(f.size)}" placeholder="Masalan: 50×150×6000" autocomplete="off"></div></div>
          <div class="g2">${numField('kQty','Soni',f.qty,UNITS[f.unit].l)}${numField('kPrice',`Narxi, 1 ${UNITS[f.unit].l}`,f.price?sp(f.price):'',"so'm",'numeric')}</div>
          ${unitSeg('ku',f.unit)}
          <div class="row num"><span class="hint grow" id="kNow"></span><b id="kSum"></b></div>
          <button class="btn pri block" type="button" id="kAdd">Qo‘shish</button>
        </div>`:''}
        ${f.added.length?`<div class="h">Qo‘shildi · ${esc(wpName(f.wp))}</div><div class="list">${f.added.map(a=>`<div class="item static"><div class="thumb sm ${a.k==='m'?'mh':'ph'}" aria-hidden="true">${esc(a.name.charAt(0))}</div><div class="grow"><div class="nm">${esc(a.name)}</div><div class="ds">${esc(a.xar||'turi ko‘rsatilmagan')}</div></div><div class="rt"><b class="num">+${fqu(a.q,a.unit)}</b><span class="ds num">${a.price?sp(Math.round(a.q*a.price))+" so'm":''}</span></div></div>`).join('')}</div>`:''}
        <div class="field"><label for="kDate">Sana</label><input class="inp" type="date" id="kDate" value="${f.date}" max="${today()}"></div>
        <div class="err" id="kErr" hidden></div>
      </div><div class="sh-foot"><button class="btn block ${f.added.length?'pri':''}" type="button" id="kDone">${f.added.length?'Tayyor':'Yopish'}</button></div>`;
      bindWpField(c,f,draw);
      $$('[data-kk]',c).forEach(b=>b.onclick=()=>{f.k=b.dataset.kk;draw()});
      bindCats(c,'kc',n=>{f.cat=sameN(f.cat,n)?null:n;f.unit=f.cat?lastUnit(f.cat,f.unit):f.unit;draw()});
      bindNewName(c,'kNew',n=>{f.cat=n;draw()});
      $('#kDate',c).onchange=e=>{f.date=e.target.value||today()};
      $('#kDone',c).onclick=()=>{closeSheet();if(f.added.length){S.wpTab=f.k;if(S.view==='wp'||S.view==='home')setView('wp',f.wp);else render()}};
      if(!f.cat)return;
      $$('[data-kt]',c).forEach(b=>b.onclick=()=>{const x=itemById(b.dataset.kt);f.tur=x.tur||'';f.size=x.size||'';if(!x.tur&&!x.size&&x.xar)f.tur=x.xar;f.unit=x.unit;f.price=x.price||'';draw()});
      $$('[data-ku]',c).forEach(b=>b.onclick=()=>{f.unit=b.dataset.ku;draw()});
      [['kTur','tur'],['kSize','size'],['kQty','qty'],['kPrice','price']].forEach(([id,k])=>{const el=$('#'+id,c);el.oninput=()=>{f[k]=k==='price'?pos(el.value):el.value;upd()}});
      const pr=$('#kPrice',c);pr.onblur=()=>{pr.value=f.price?sp(Math.round(f.price)):''};
      $('#kAdd',c).onclick=add;upd();
    };
    const upd=()=>{const s=$('#kSum',c);if(!s)return;s.textContent=som(pos(f.qty)*pos(f.price));
      const ex=S.items.find(x=>itemKey(x)===itemKey({wp:f.wp,k:f.k,name:f.cat,xar:xarOf(f.tur,f.size),unit:f.unit}));
      $('#kNow',c).textContent=ex?`Omborda bor: ${fqu(ex.qty,ex.unit)} → ${fqu(r4(ex.qty+pos(f.qty)),ex.unit)}`:'Yangi tur bo‘lib qo‘shiladi'};
    const add=async()=>{
      const err=$('#kErr',c);const q=pos(f.qty);
      if(!q){err.textContent='Sonini kiriting.';err.hidden=false;return}
      const ch=await applyStock([{wp:f.wp,k:f.k,name:f.cat,tur:f.tur,size:f.size,unit:f.unit,dq:q,price:f.price}]);
      const it=itemById(ch[0].itemId);
      const op={id:uid('o'),ts:Date.now(),date:(f.date&&f.date<=today())?f.date:today(),time:nowTime(),kind:'in',wp:f.wp,tayyor:f.k==='m',lines:[lineOf(it,q,{price:Math.round(pos(f.price)||it.price||0)})]};
      op.total=Math.round(q*(op.lines[0].price||0));await saveOp(op);
      f.added.push({k:f.k,name:it.name,xar:it.xar,unit:it.unit,q,price:op.lines[0].price});
      toast(`${wpName(f.wp)}: +${fqu(q,it.unit)} ${it.name}`);
      f.cat=null;f.tur='';f.size='';f.qty='';f.price='';draw();render();
    };
    draw();
  });
}

/* ---------- mahsulot chiqarish ---------- */
function makeSheet(wp){
  wp=wp||curWp();
  const f={pwp:wp,fcat:null,pid:null,pq:'',used:[],cat:null,tur:'',size:'',unit:'dona',qty:'',price:'',outs:[],out:wp,date:today()};
  openSheet('Mahsulot chiqarish',api=>{
    const c=api.content;
    const usedOf=id=>f.used.filter(u=>u.id===id).reduce((a,u)=>a+u.q,0);
    const draw=()=>{
      const pool=itemsOf(f.pwp,'x').filter(x=>x.qty>EPS),list=f.fcat?pool.filter(x=>sameN(x.name,f.fcat)):pool;const P=itemById(f.pid);
      c.innerHTML=`<div class="sh-body">
        <div class="stepn"><i>1</i>Qaysi ish joyidagi xomashyodan, qancha?</div>
        ${wpField(f,'pwp','Xomashyo qaysi ish joyidan')}
        <div class="field"><span class="lbl">Xomashyo nomi — bosing</span>${catGrid('mf',f.fcat,pool)}</div>
        ${list.length?`<div class="list">${list.map(x=>itemRow({...x,qty:r4(x.qty-usedOf(x.id))},{pick:true,on:f.pid===x.id})).join('')}</div>`:`<div class="empty">${f.fcat?esc(wpName(f.pwp))+'da '+esc(f.fcat)+' xomashyosi yo‘q':'Bu ish joyida xomashyo yo‘q'}</div>`}
        ${P?`<div class="row"><div class="grow">${numField('mPq',`Ishlatildi (${UNITS[P.unit].l}, bor: ${fq(P.qty-usedOf(P.id))})`,f.pq,UNITS[P.unit].l)}</div><button class="btn pri" type="button" id="mUse" style="align-self:flex-end">+ Qo‘shish</button></div>`:''}
        ${f.used.length?`<div class="list">${f.used.map((u,i)=>{const x=itemById(u.id);return `<div class="item static"><div class="thumb sm ph" aria-hidden="true">${esc(x.name.charAt(0))}</div><div class="grow"><div class="nm">${esc(x.name)}</div><div class="ds">${esc(x.xar||'')} · ${esc(wpName(x.wp))}</div></div><b class="num">−${fqu(u.q,x.unit)}</b><button class="x2" type="button" data-ux="${i}" aria-label="Olib tashlash">×</button></div>`}).join('')}</div>`:''}
        <div class="stepn"><i>2</i>Qanday mahsulot, qancha chiqdi?</div>
        <div class="field"><span class="lbl">Mahsulot nomi — bosing</span>${catGrid('mc',f.cat)}</div>
        ${newNameRow('mNew')}
        ${f.cat?`<div class="card xc">
          <div class="xh"><b>${esc(f.cat)}</b><span>Xarakteristikasi = turi + o‘lchami + soni + narxi</span></div>
          ${typeChips('mt',typesOf(f.cat,f.out,'m'))}
          <div class="g2"><div class="field"><label for="mTur">Turi</label><input class="inp" id="mTur" value="${esc(f.tur)}" placeholder="Masalan: qarag‘ay" autocomplete="off"></div>
            <div class="field"><label for="mSize">O‘lchami</label><input class="inp" id="mSize" value="${esc(f.size)}" placeholder="Masalan: 20×40×3000" autocomplete="off"></div></div>
          <div class="g2">${numField('mQty','Soni (chiqdi)',f.qty,UNITS[f.unit].l)}${numField('mPrice',`Sotuv narxi, 1 ${UNITS[f.unit].l}`,f.price?sp(f.price):'',"so'm",'numeric')}</div>
          ${unitSeg('mu',f.unit)}
          <button class="btn pri block" type="button" id="mOut">Qo‘shish</button></div>`:''}
        ${f.outs.length?`<div class="list">${f.outs.map((o,i)=>`<div class="item static"><div class="thumb sm mh" aria-hidden="true">${esc(o.name.charAt(0))}</div><div class="grow"><div class="nm">${esc(o.name)}</div><div class="ds">${esc(xarOf(o.tur,o.size)||'turi ko‘rsatilmagan')}${o.price?' · '+sp(o.price)+" so'm":''}</div></div><b class="num">+${fqu(o.q,o.unit)}</b><button class="x2" type="button" data-ox="${i}" aria-label="Olib tashlash">×</button></div>`).join('')}</div>`:''}
        ${wpField(f,'out','Mahsulot qaysi ish joyiga yoziladi')}
        <div class="field"><label for="mDate">Sana</label><input class="inp" type="date" id="mDate" value="${f.date}" max="${today()}"></div>
        <div class="err" id="mErr" hidden></div>
      </div><div class="sh-foot"><button class="btn pri block" type="button" id="mSave">Mahsulotni yozish</button></div>`;
      bindWpField(c,f,()=>{f.pid=null;f.pq='';draw()},'pwp');bindWpField(c,f,draw,'out');
      bindCats(c,'mf',n=>{f.fcat=sameN(f.fcat,n)?null:n;f.pid=null;draw()});
      $$('[data-it]',c).forEach(b=>b.onclick=()=>{f.pid=f.pid===b.dataset.it?null:b.dataset.it;f.pq='';draw();const q=$('#mPq',c);if(q)q.focus()});
      const pq=$('#mPq',c);if(pq)pq.oninput=()=>{f.pq=pq.value};
      const mu=$('#mUse',c);if(mu)mu.onclick=use;
      $$('[data-ux]',c).forEach(b=>b.onclick=()=>{f.used.splice(+b.dataset.ux,1);draw()});
      $$('[data-ox]',c).forEach(b=>b.onclick=()=>{f.outs.splice(+b.dataset.ox,1);draw()});
      bindCats(c,'mc',n=>{f.cat=sameN(f.cat,n)?null:n;if(f.cat)f.unit=lastUnit(f.cat,f.unit);draw()});
      bindNewName(c,'mNew',n=>{f.cat=n;draw()});
      $('#mDate',c).onchange=e=>{f.date=e.target.value||today()};
      $('#mSave',c).onclick=save;
      if(f.cat){
        $$('[data-mt]',c).forEach(b=>b.onclick=()=>{const x=itemById(b.dataset.mt);f.tur=x.tur||'';f.size=x.size||'';if(!x.tur&&!x.size&&x.xar)f.tur=x.xar;f.unit=x.unit;f.price=x.price||'';draw()});
        $$('[data-mu]',c).forEach(b=>b.onclick=()=>{f.unit=b.dataset.mu;draw()});
        [['mTur','tur'],['mSize','size'],['mQty','qty'],['mPrice','price']].forEach(([id,k])=>{const el=$('#'+id,c);el.oninput=()=>{f[k]=k==='price'?pos(el.value):el.value}});
        $('#mOut',c).onclick=()=>{const q=pos(f.qty);if(!q){fail('Qancha chiqqanini kiriting.');return}
          f.outs.push({name:f.cat,tur:f.tur.trim(),size:f.size.trim(),unit:f.unit,q,price:Math.round(pos(f.price))});f.cat=null;f.tur='';f.size='';f.qty='';f.price='';draw()};
      }
    };
    const fail=t=>{const e=$('#mErr',c);e.textContent=t;e.hidden=false;e.scrollIntoView({block:'nearest'})};
    const use=async()=>{
      const P=itemById(f.pid);const q=pos(f.pq);if(!q){fail('Ishlatilgan miqdorni kiriting.');return}
      const left=r4(P.qty-usedOf(P.id));
      if(q>left+EPS&&!await askConfirm('Qoldiqdan ko‘p ishlatilyapti',[`${wpName(P.wp)}da ${P.name}${P.xar?' ('+P.xar+')':''} ${fqu(Math.max(0,left),P.unit)} bor.`,`Siz ${fqu(q,P.unit)} yozdingiz — qoldiq ${fqu(r4(left-q),P.unit)} bo‘lib qoladi (kiritilmagan).`],'Miqdor to‘g‘rimi? Adashgan bo‘lsangiz «Yo‘q» ni bosib tuzating.'))return;
      f.used.push({id:P.id,q});f.pid=null;f.pq='';draw();
    };
    const save=async()=>{
      if(!f.used.length)return fail('1-qadam: qaysi xomashyodan qancha ishlatilganini qo‘shing.');
      if(!f.outs.length)return fail('2-qadam: mahsulot nomini bosib, «Qo‘shish» tugmasini bosing.');
      const used=f.used.map(u=>{const x=itemById(u.id);return lineOf(x,u.q,{wp:x.wp})});
      const ch=[...used.map(l=>({...l,dq:-l.q,setPrice:false})),...f.outs.map(o=>({wp:f.out,k:'m',name:o.name,tur:o.tur,size:o.size,unit:o.unit,dq:o.q,price:o.price}))];
      await applyStock(ch);
      const lines=f.outs.map((o,i)=>{const x=itemById(ch[used.length+i].itemId);return lineOf(x,o.q,{price:o.price||x.price||0})});
      const op={id:uid('o'),ts:Date.now(),date:(f.date&&f.date<=today())?f.date:today(),time:nowTime(),kind:'make',wp:f.out,used,lines};
      await saveOp(op);closeSheet();S.wpTab='m';setView('wp',f.out);
      toast('Yozildi: '+lines.map(l=>l.name+' '+fqu(l.q,l.unit)).join(', '));
    };
    draw();
  });
}

/* ---------- ko‘chirish ---------- */
function moveSheet(wp){
  wp=wp||curWp();
  const f={from:wp,to:(S.wps.find(w=>w.id!==wp)||{}).id,k:'x',fcat:null,id:null,q:'',date:today()};
  openSheet('Ko‘chirish',api=>{
    const c=api.content;
    const draw=()=>{
      if(f.to===f.from)f.to=(S.wps.find(w=>w.id!==f.from)||{}).id;
      const pool=itemsOf(f.from,f.k).filter(x=>x.qty>EPS),list=f.fcat?pool.filter(x=>sameN(x.name,f.fcat)):pool;const X=itemById(f.id);
      c.innerHTML=`<div class="sh-body">
        ${wpField(f,'from','Qayerdan')}
        <div class="field"><span class="lbl">Qayerga</span><div class="seg" role="group">${S.wps.filter(w=>w.id!==f.from).map(w=>`<button type="button" data-to="${w.id}" aria-pressed="${f.to===w.id}">${esc(w.name)}</button>`).join('')}</div></div>
        <div class="seg tabs2" role="group"><button type="button" data-mk="x" aria-pressed="${f.k==='x'}">Xomashyo</button><button type="button" data-mk="m" aria-pressed="${f.k==='m'}">Mahsulot</button></div>
        <div class="field"><span class="lbl">Nomi — bosing</span>${catGrid('vf',f.fcat,pool)}</div>
        ${list.length?`<div class="list">${list.map(x=>itemRow(x,{pick:true,on:f.id===x.id})).join('')}</div>`:`<div class="empty">${f.fcat?esc(wpName(f.from))+'da '+esc(f.fcat)+' ('+KIND[f.k].toLowerCase()+') yo‘q':'Bu ish joyida ko‘chiradigan narsa yo‘q'}</div>`}
        ${X?`<div class="row"><div class="grow">${numField('vQ',`Qancha ko‘chiriladi (bor: ${fq(X.qty)})`,f.q,UNITS[X.unit].l)}</div><button class="btn" type="button" id="vAll" style="align-self:flex-end">Hammasi</button></div>`:''}
        <div class="field"><label for="vDate">Sana</label><input class="inp" type="date" id="vDate" value="${f.date}" max="${today()}"></div>
        <div class="err" id="vErr" hidden></div>
      </div><div class="sh-foot"><button class="btn pri block" type="button" id="vSave">Ko‘chirish</button></div>`;
      bindWpField(c,f,()=>{f.id=null;f.q='';draw()},'from');
      $$('[data-to]',c).forEach(b=>b.onclick=()=>{f.to=b.dataset.to;draw()});
      $$('[data-mk]',c).forEach(b=>b.onclick=()=>{f.k=b.dataset.mk;f.id=null;f.q='';draw()});
      bindCats(c,'vf',n=>{f.fcat=sameN(f.fcat,n)?null:n;f.id=null;draw()});
      $$('[data-it]',c).forEach(b=>b.onclick=()=>{f.id=f.id===b.dataset.it?null:b.dataset.it;f.q='';draw();const q=$('#vQ',c);if(q)q.focus()});
      const q=$('#vQ',c);if(q)q.oninput=()=>{f.q=q.value};
      const al=$('#vAll',c);if(al)al.onclick=()=>{f.q=String(X.qty).replace('.',',');draw()};
      $('#vDate',c).onchange=e=>{f.date=e.target.value||today()};
      $('#vSave',c).onclick=save;
    };
    const fail=t=>{const e=$('#vErr',c);e.textContent=t;e.hidden=false};
    const save=async()=>{
      const X=itemById(f.id);const q=pos(f.q);
      if(!f.to)return fail('Boshqa ish joyini tanlang.');
      if(!X)return fail('Nimani ko‘chirishni tanlang.');if(!q)return fail('Miqdorni kiriting.');
      if(q>X.qty+EPS&&!await askConfirm('Qoldiqdan ko‘p ko‘chirilyapti',[`${wpName(f.from)}da ${X.name}${X.xar?' ('+X.xar+')':''} ${fqu(Math.max(0,X.qty),X.unit)} bor.`,`Siz ${fqu(q,X.unit)} ko‘chiryapsiz — ${wpName(f.from)}da qoldiq ${fqu(r4(X.qty-q),X.unit)} bo‘lib qoladi (kiritilmagan).`],'Miqdor to‘g‘rimi? Adashgan bo‘lsangiz «Yo‘q» ni bosib tuzating.'))return;
      const line=lineOf(X,q);
      const ch=await applyStock([{...line,wp:f.from,dq:-q,setPrice:false},{...line,itemId:'',wp:f.to,dq:q,price:X.price,setPrice:false}]);
      line.toItemId=ch[1].itemId;
      const op={id:uid('o'),ts:Date.now(),date:(f.date&&f.date<=today())?f.date:today(),time:nowTime(),kind:'move',wp:f.from,to:f.to,lines:[line]};
      await saveOp(op);closeSheet();S.wpTab=X.k;setView('wp',f.to);toast(`Ko‘chirildi: ${X.name} ${fqu(q,X.unit)} → ${wpName(f.to)}`);
    };
    draw();
  });
}

    $('#iTur',c).oninput=e=>{f.tur=e.target.value};$('#iSize',c).oninput=e=>{f.size=e.target.value};
    const ip=$('#iPrice',c);ip.oninput=()=>{f.price=pos(ip.value)};ip.onblur=()=>{ip.value=f.price?sp(Math.round(f.price)):''};
    const ia=$('#iAct',c);ia.oninput=()=>{const v=num(ia.value);$('#iDiff',c).textContent=isFinite(v)?`Farq: ${v-x.qty>=0?'+':''}${fqu(r4(v-x.qty),x.unit)}`:`Ilova bo‘yicha: ${fqu(x.qty,x.unit)}`};
    bindOps(c);
    const adjTo=async(v,note)=>{const d=r4(v-x.qty);if(!d)return false;
      const op={id:uid('o'),ts:Date.now(),date:today(),time:nowTime(),kind:'adj',wp:x.wp,note,lines:[lineOf(x,d)]};
      await applyStock([{...op.lines[0],itemId:x.id,dq:d,setPrice:false}]);await saveOp(op);return true};
    $('#iAdj',c).onclick=async()=>{const v=num(ia.value);if(!isFinite(v)||v<0){const e=$('#iErr',c);e.textContent='Qoldiqni raqam bilan yozing.';e.hidden=false;return}
      const ch=await adjTo(v,$('#iWhy',c).value.trim());closeSheet();render();toast(ch?`Qoldiq: ${fqu(v,x.unit)}`:"Farq yo'q, qoldiq to'g'ri")};
    $('#iSave',c).onclick=async()=>{
      const xar=xarOf(f.tur,f.size);const probe={...x,k:f.k,xar,unit:f.unit};const old=x.unit;
      const clash=S.items.find(y=>y.id!==x.id&&itemKey(y)===itemKey(probe));
      if(clash&&!await askConfirm('Bunday tur allaqachon bor',[`${wpName(x.wp)}da ${x.name}${xar?' ('+xar+')':''} ${fqu(clash.qty,clash.unit)} bor.`,`Ikkalasi bitta qatorga qo‘shiladi: ${fqu(clash.qty,clash.unit)} + ${fqu(x.qty,f.unit)} = ${fqu(r4(clash.qty+x.qty),f.unit)}.`],'','Ha, qo‘shish'))return;
      // relabel the unit in this item's own records (the number stays, only the unit was wrong)
      if(f.unit!==old){const ch=[];S.ops.forEach(o=>{let hit=false;[...o.lines,...(o.used||[])].forEach(l=>{if((l.itemId===x.id||l.toItemId===x.id)&&l.unit===old){l.unit=f.unit;hit=true}});
        if(hit){o.events=[...(o.events||[]),{ts:Date.now(),text:`birlik ${UNITS[old].l} → ${UNITS[f.unit].l}`}];ch.push(o)}});await DB.putMany('ops',ch)}
      Object.assign(x,{k:f.k,unit:f.unit,tur:f.tur.trim(),size:f.size.trim(),xar,price:Math.round(pos(f.price)),updated:Date.now()});
      if(clash){clash.qty=r4(clash.qty+x.qty);if(x.price)clash.price=x.price;clash.updated=Date.now();await DB.put('items',clash);
        S.ops.forEach(o=>[...o.lines,...(o.used||[])].forEach(l=>{if(l.itemId===x.id)l.itemId=clash.id;if(l.toItemId===x.id)l.toItemId=clash.id}));await DB.putMany('ops',S.ops.filter(o=>[...o.lines,...(o.used||[])].some(l=>l.itemId===clash.id||l.toItemId===clash.id)));
        await DB.del('items',x.id);S.items=S.items.filter(y=>y.id!==x.id)}
      else await DB.put('items',x);
      const v=num(ia.value);if(!clash&&isFinite(v)&&v>=0)await adjTo(v,$('#iWhy',c).value.trim());
      closeSheet();render();toast(f.unit!==old?`Birlik almashtirildi: ${fqu(x.qty,f.unit)}`:'Saqlandi')};
    $('#iDel',c).onclick=async()=>{
      if(Math.abs(x.qty)>EPS&&!await askConfirm(`${x.name} o‘chirilsinmi?`,[`${wpName(x.wp)} · ${x.name} (${x.xar||'turi ko‘rsatilmagan'})`,`Qoldig‘i ${fqu(x.qty,x.unit)} — bu miqdor ombordan chiqariladi va «Sanab tuzatish» bo‘lib tarixga yoziladi.`],'','Ha, o‘chirish'))return;
      if(Math.abs(x.qty)>EPS)await adjTo(0,'ro‘yxatdan o‘chirildi');
      await DB.del('items',x.id);S.items=S.items.filter(y=>y.id!==x.id);closeSheet();render();toast('O‘chirildi')};
  });
}

/* ---------- one operation ---------- */

  if(!o)return;
  openSheet(`${OPK[o.kind]} · ${dmy(o.date)}`,api=>{
    const c=api.content;const debt=o.kind==='sale'&&S.debts.find(d=>(d.saleIds||[]).includes(o.id));
    const row=l=>`<div class="item static"><div class="thumb sm ${l.k==='m'?'mh':'ph'}" aria-hidden="true">${esc(l.name.charAt(0))}</div><div class="grow"><div class="nm">${esc(l.name)}</div><div class="ds">${esc(l.xar||'turi ko‘rsatilmagan')}${l.how?' · '+esc(l.how):''}${l.short?` · <span class="qneg">${fqu(l.short,l.unit)} kiritilmagan</span>`:''}</div></div><div class="rt"><b class="num">${fqu(l.q,l.unit)}</b>${o.kind==='sale'?`<span class="ds num">${sp(Math.round(l.sum))} so'm</span>`:l.price?`<span class="ds num">${sp(l.price)}</span>`:''}</div></div>`;
    c.innerHTML=`<div class="sh-body">
      <div class="hint">${esc(opWps(o).map(wpName).join(' → '))}${o.time?' · '+o.time:''}${o.legacy?' · 1.4 versiyadan':''}</div>
      ${o.kind==='make'?`<div class="h">Ishlatilgan xomashyo</div><div class="list">${o.used.map(l=>row({...l,xar:(l.xar?l.xar+' · ':'')+wpName(l.wp)})).join('')}</div><div class="h">Chiqqan mahsulot</div>`:''}
      <div class="list">${o.lines.map(row).join('')}</div>
      ${o.kind==='sale'?`<div class="card kv">${o.disc&&o.disc.amount?`<div><span>Chegirmasiz</span><b class="num">${som(o.sub)}</b></div><div><span>Chegirma</span><b class="num">−${som(o.disc.amount)}</b></div>`:''}<div><span>Jami</span><b class="num">${som(o.total)}</b></div><div><span>To‘lov</span><b>${PAYS[o.pay||'naqd']}${o.card&&o.card.toLabel?' · '+esc(o.card.toLabel):''}</b></div>
        ${o.client||o.phone?`<div><span>Mijoz</span><b>${esc(o.client||'')}${o.phone?' · '+esc(fmtPhone(o.phone)):''}</b></div>`:''}
        ${o.card&&o.card.from?`<div><span>Mijoz kartasi</span><b class="num">${esc(maskCard(o.card.from))}</b></div>`:''}
        ${o.dlv?`<div><span>Yetkazildi</span><b>${esc([o.dlv.driver,o.dlv.phone?fmtPhone(o.dlv.phone):'',o.dlv.car,o.dlv.addr].filter(Boolean).join(', '))}</b></div>`:''}</div>
        ${o.card&&o.card.proofPhoto?`<img class="proof" src="${o.card.proofPhoto}" alt="To‘lov cheki">`:''}${o.card&&o.card.proofText?`<div class="note-n">${esc(o.card.proofText)}</div>`:''}
        ${o.dlv&&o.dlv.photo?`<img class="proof" src="${o.dlv.photo}" alt="Mashina surati">`:''}
        ${debt?`<button class="btn" type="button" id="oDebt">Nasiya shartnomasi · ${esc(debt.no)}</button>`:''}`:''}
      ${o.note?`<div class="note-n">${esc(o.note)}</div>`:''}
      ${o.legacy?'<p class="hint" style="margin:0">Bu yozuv 1.4 versiyadan ko‘chirilgan; uning qoldiqqa ta’siri allaqachon hisobda. O‘chirish uchun oyni yoping.</p>':'<button class="btn dan" type="button" id="oDel">O‘chirish</button>'}
    </div>`;
    const db=$('#oDebt',c);if(db)db.onclick=()=>debtView(debt);
    const del=$('#oDel',c);if(del)del.onclick=()=>deleteOp(o);
  });
}
async function deleteOp(o){
  const debt=o.kind==='sale'&&S.debts.find(d=>(d.saleIds||[]).includes(o.id));
  if(debt&&debt.status!=='draft'){toast('Bu sotuvga imzolangan nasiya shartnomasi bor — o‘chirib bo‘lmaydi');return}
  const eff=opEffects(o,-1);const lines=[];
  eff.forEach(e=>{const it=(e.itemId&&itemById(e.itemId))||S.items.find(x=>itemKey(x)===itemKey({...e}));const now=it?it.qty:0;if(now+e.dq<-EPS&&e.dq<0)lines.push(`${e.name}${e.xar?' ('+e.xar+')':''} · ${wpName(e.wp)}: qoldiq ${fqu(now,e.unit)} → ${fqu(r4(now+e.dq),e.unit)}`)});
  const ok=await askConfirm(`${OPK[o.kind]} o‘chirilsinmi?`,[`${dmy(o.date)} · ${opText(o)}`,o.kind==='sale'?'Sotilgan tovarlar omborga qaytadi.':o.kind==='in'?'Kiritilgan miqdor ombordan ayriladi.':o.kind==='move'?'Tovar oldingi ish joyiga qaytadi.':o.kind==='make'?'Xomashyo qaytadi, chiqqan mahsulot ayriladi.':'Tuzatish bekor qilinadi.',...lines,...(debt?['Nasiya qoralamasi ham o‘chiriladi.']:[])],'','Ha, o‘chirish');
  if(!ok)return;
  await applyStock(eff);await DB.del('ops',o.id);S.ops=S.ops.filter(x=>x.id!==o.id);
  if(debt){await DB.del('debts',debt.id);S.debts=S.debts.filter(d=>d.id!==debt.id);rescheduleReminders()}
  closeSheet();render();toast('O‘chirildi');
}

          ${unitSeg('nu',f.nunit)}<button class="btn pri block" type="button" id="nAdd">Chekka qo‘shish</button>`:''}</div>`:''}

      lastSteps=steps.join();
      $$('[data-dk]',box).forEach(b=>b.onclick=()=>{const k=b.dataset.dk,v=+b.dataset.dv;f.disc=is(k,v)?null:{kind:k,v,src:'chip'};f.discIn='';drawDisc();update()});
      const di=$('#fDiscIn',box);di.oninput=()=>{f.discIn=di.value;const pd=parseDisc(di.value);f.disc=pd?{...pd,src:'manual'}:null;$$('[data-dk]',box).forEach(x=>x.setAttribute('aria-pressed','false'));update()};
    };
    const update=()=>{
      const s=sub(),d=discAmt(s),fin=s-d;
      if(f.cart.length&&discSteps(s).join()!==lastSteps)drawDisc();
      f.cart.forEach((l,i)=>{const q=pos(l.q),av=avail(l),w=$('#cw'+i,c);if(!w)return;
        $('#cs'+i,c).textContent=som(q*pos(l.p));
        const short=l.id==null||q>av+EPS;
        w.className='grow '+(!q||short?'wn2':'hint');
        w.textContent=!q?'Sonini kiriting':l.id==null?`Omborda yo‘q — qoldiq −${fqu(q,l.unit)} bo‘ladi`:short?(av>0?`Omborda ${fqu(av,l.unit)} bor — ${fqu(r4(q-av),l.unit)} kiritilmagan bo‘lib qoladi`:'Omborda yo‘q — qoldiq minusga o‘tadi'):`Omborda ${fqu(av,l.unit)} bor`});
      $('#rQ',c).textContent=f.cart.length?`${f.cart.length} ta tovar · ${sp(s)} so'm`:'Yuqoridan sotiladigan tovarlarni belgilang';
      const rd=$('#rD',c);rd.hidden=!d;if(d)rd.textContent=`Chegirma: −${sp(d)} so'm (${fq(d/s*100,1)}%)`;
      $('#rT',c).innerHTML=`${sp(fin)}<small>so'm</small>`;proofChk();
    };
    const drawPay=()=>{
      const box=$('#payBox',c);
      if(f.pay==='nasiya'){box.innerHTML=`<div class="note-n">Sotuv yozilgach <b>nasiya shartnomasi</b> oynasi ochiladi: to'lov jadvali, xaridor va kafil ma'lumotlari, surat va imzolar.</div>`;return}
      if(f.pay!=='karta'){box.innerHTML='';return}
      const cs=myCards();
      box.innerHTML=`<div class="block card-pay">
        <div class="lbl">Qaysi kartamga tushdi</div>
        <div class="chips">${cs.map(k=>`<button type="button" class="dchip" data-cto="${k.id}" aria-pressed="${f.card.to===k.id}">${esc(cardLabel(k))}</button>`).join('')}<button type="button" class="dchip add" id="fAddCard">+ Karta qo'shish</button></div>
        <div class="field"><label for="fCardFrom">Mijoz kartasi</label><div class="row"><input class="inp num grow" id="fCardFrom" inputmode="numeric" value="${esc(fmtCard(f.card.from))}" placeholder="8600 0000 0000 0000" autocomplete="off">
          ${NATIVE?`<label class="btn sm" for="fCardScan">${ICON.scan} Skaner</label><input type="file" id="fCardScan" accept="image/*" capture="environment" hidden>`:''}</div><div class="hint" id="fCardInfo"></div></div>
        <div class="lbl">Tasdiq (ixtiyoriy, lekin tavsiya)</div>
        <div id="fProofPh"></div>
        <div class="field"><div class="row"><label for="fProofTx" class="lbl grow">SMS / xabarnoma matni</label><button class="btn sm" type="button" id="fPaste">${ICON.paste} Nusxadan qo'yish</button></div>
          <textarea class="inp" id="fProofTx" rows="3" placeholder="Bank SMS xabarini shu yerga qo'ying">${esc(f.card.proofText)}</textarea><div class="hint" id="fProofChk"></div></div>
        <p class="hint" style="margin:0">Ilova pul o‘tkazmaydi, faqat to‘lovni va uning isbotini yozib qo‘yadi.</p>
      </div>`;
      $$('[data-cto]',box).forEach(b=>b.onclick=()=>{f.card.to=b.dataset.cto;$$('[data-cto]',box).forEach(x=>x.setAttribute('aria-pressed',x===b))});
      $('#fAddCard',box).onclick=()=>cardSheet(null,k=>{f.card.to=k.id;drawPay()});
      const cf=$('#fCardFrom',box);const info=()=>{const d=cardDigits(cf.value);$('#fCardInfo',box).textContent=d.length?`${cardBank(d)||'Karta'}${d.length>=16?(luhn(d)?' · raqam to‘g‘ri':' · raqamni tekshiring'):''}`:''};
      cf.oninput=()=>{cf.value=fmtCard(cf.value);f.card.from=cardDigits(cf.value);info()};info();
      const sc=$('#fCardScan',box);if(sc)sc.onchange=async e=>{const fl=e.target.files[0];if(!fl)return;toast('Karta o‘qilmoqda…');try{const n=await scanCardNumber(fl);if(n){f.card.from=n;cf.value=fmtCard(n);info();toast('Karta raqami topildi')}else toast("Raqam o'qilmadi, qo'lda kiriting")}catch(er){toast("Skanerlab bo'lmadi, qo'lda kiriting")}e.target.value=''};
      mountPhoto($('#fProofPh',box),{label:'Chek / to‘lov skrinshoti',value:f.card.proofPhoto,max:1100,onChange:v=>{f.card.proofPhoto=v}});
      const tx=$('#fProofTx',box);tx.oninput=()=>{f.card.proofText=tx.value;proofChk()};
      $('#fPaste',box).onclick=async()=>{const t=await pasteText();if(t){tx.value=t;f.card.proofText=t;proofChk()}else{tx.focus();toast("Matnni bosib turib «Qo'yish»ni tanlang")}};
      proofChk();
    };
    const proofChk=()=>{const el=$('#fProofChk',c);if(!el)return;const fin=final();const am=smsAmount(f.card.proofText);
      el.className='hint'+(am.length?(am.includes(fin)?' okc':' bad'):'');el.textContent=!f.card.proofText.trim()?'':!am.length?"Xabarda summa topilmadi":am.includes(fin)?`✓ Summa mos: ${som(fin)}`:`Xabardagi summa: ${am.map(sp).join(', ')} so'm — chek summasi ${som(fin)}`};
    const drawDlv=()=>{
      const box=$('#dlvBox',c);if(!f.dlvOn){box.innerHTML='';return}
      box.innerHTML=`<div class="sub">${personHTML('fd','Haydovchi',f.dlv.driver,f.dlv.phone)}
        <div class="g2"><div class="field"><label for="fCar">Mashina raqami</label><input class="inp" id="fCar" value="${esc(f.dlv.car)}" placeholder="01 A 123 BC" autocomplete="off"></div>
        <div class="field"><label for="fAddr">Manzil</label><input class="inp" id="fAddr" value="${esc(f.dlv.addr)}" placeholder="Qayerga" autocomplete="off"></div></div>
        <div id="fDlvPh"></div></div>`;
      bindPerson(box,'fd',f.dlv,'driver','phone',{role:'driver'});
      $('#fCar',box).oninput=e=>{f.dlv.car=e.target.value};$('#fAddr',box).oninput=e=>{f.dlv.addr=e.target.value};
      mountPhoto($('#fDlvPh',box),{label:'Yuk ortilgan mashina surati',value:f.dlv.photo,max:1000,onChange:v=>{f.dlv.photo=v}});
    };
    const save=async()=>{
      const err=$('#fErr',c);const fail=m=>{err.textContent=m;err.hidden=false;err.scrollIntoView({block:'nearest'})};
      if(!f.cart.length)return fail('Sotiladigan tovarni belgilang.');
      const bad=f.cart.find(l=>!pos(l.q));if(bad)return fail(`${bad.name}: sonini kiriting.`);
      const np=f.cart.find(l=>!pos(l.p));if(np)return fail(`${np.name}: narxini kiriting.`);
      if(f.pay==='nasiya'&&!String(f.client||'').trim()&&!digits(f.phone))return fail('Nasiya uchun mijoz ismi va telefonini kiriting.');
      if(f.pay==='karta'&&myCards().length&&!f.card.to)return fail('Pul qaysi kartangizga tushganini tanlang.');
      if(f.dlvOn&&!digits(f.dlv.phone)&&!String(f.dlv.driver||'').trim())return fail('Haydovchi ismi yoki telefonini kiriting.');
      const shorts=f.cart.map(l=>{const q=pos(l.q),av=avail(l);return {l,q,av,short:r4(Math.max(0,q-Math.max(0,av)))}}).filter(z=>z.short>EPS);
      if(shorts.length&&!await askConfirm('Omborda yetarli emas',shorts.map(z=>`${z.l.name}${z.l.xar?' ('+z.l.xar+')':''}: ${z.l.id==null||z.av<=0?'omborda yo‘q':'omborda '+fqu(z.av,z.l.unit)+' bor'}, sotilyapti ${fqu(z.q,z.l.unit)} → ${fqu(z.short,z.l.unit)} kiritilmagan bo‘lib qoladi.`),'Sotuv yoziladi, yetishmagan qismi «kiritilmagan» bo‘lib turadi. Soni noto‘g‘ri bo‘lsa, «Yo‘q» ni bosib tuzating.'))return;
      const s=sub(),d=discAmt(s),fin=s-d;
      // spread the discount over the lines so every line keeps its real (net) money
      let restNet=fin;const lines=f.cart.map((l,i)=>{const q=r4(pos(l.q)),gross=Math.round(q*pos(l.p));const net=i===f.cart.length-1?restNet:Math.round(s?gross*fin/s:gross);restNet-=net;
        const av=avail(l);return {itemId:l.id||'',wp:f.wp,k:l.k,name:l.name,tur:l.tur,size:l.size,xar:l.xar,unit:l.unit,q,price:Math.round(pos(l.p)),gross,sum:net,short:r4(Math.max(0,q-Math.max(0,av)))}});
      const ch=await applyStock(lines.map(l=>({...l,dq:-l.q,setPrice:false})));lines.forEach((l,i)=>{l.itemId=ch[i].itemId});
      const cl=await upsertClient({name:f.client,phone:f.phone,role:'client'});
      const cto=f.pay==='karta'?cardById(f.card.to):null;
      const op={id:uid('s'),ts:Date.now(),date:(f.date&&f.date<=today())?f.date:today(),time:nowTime(),kind:'sale',wp:f.wp,lines,sub:s,disc:d?{kind:f.disc.kind,v:f.disc.v,amount:d}:null,total:fin,
        pay:f.pay,client:String(f.client||'').trim(),phone:normPhone(f.phone),clientId:cl?cl.id:'',
        card:f.pay==='karta'?{to:f.card.to||'',toLabel:cto?cardLabel(cto):'',from:cardDigits(f.card.from),proofPhoto:f.card.proofPhoto||'',proofText:String(f.card.proofText||'').trim()}:null,
        dlv:f.dlvOn?{driver:String(f.dlv.driver||'').trim(),phone:normPhone(f.dlv.phone),car:String(f.dlv.car||'').trim(),addr:String(f.dlv.addr||'').trim(),photo:f.dlv.photo||''}:null};
      if(op.dlv&&(op.dlv.driver||op.dlv.phone))await upsertClient({name:op.dlv.driver,phone:op.dlv.phone,role:'driver'});
      await saveOp(op);
      if(!S.meta.persistAsked&&navigator.storage&&navigator.storage.persist){setMeta('persistAsked',1);navigator.storage.persist().catch(()=>{})}
      closeSheet();render();
      if(op.pay==='nasiya'){setTimeout(()=>debtSheet(newDebtFromSale(op),true),260);return}
      toast(`Yozildi: ${som(op.total)}`);
    };
    draw();
  });
}
