async function restore(file,opt={}){
  let d;try{d=JSON.parse(await file.text());if(d.app!=='calculator-yogoch'||!Array.isArray(d.sales))throw 0}catch(e){toast("Bu fayl Muhāsib zaxirasi emas");return}
  try{
    const T=opt.target||null;
    const ps=(d.products||[]).filter(p=>p&&p.id&&p.name);
    let ss=d.sales.filter(s=>s&&s.id&&s.date&&s.productName),mm=(d.moves||[]).filter(m=>m&&m.id&&m.date&&m.productId),dd=(d.debts||[]).filter(x=>x&&x.id&&x.client),cc=(d.clients||[]).filter(x=>x&&x.id);
    // full backup on a fresh phone: drop untouched default products that the backup replaces by name
    if(d.full&&!T){const used=new Set([...S.sales,...S.moves].map(x=>x.productId));const names=new Set(ps.map(p=>p.name));
      const drop=S.products.filter(p=>!used.has(p.id)&&names.has(p.name)&&!ps.some(q=>q.id===p.id));
      if(drop.length){await DB.delMany('products',drop.map(p=>p.id));S.products=S.products.filter(p=>!drop.includes(p))}}
    // products: same id or (when importing a manager's file) same name
    const pmap=new Map();const newP=[];
    for(const p of ps){let ex=prod(p.id);if(!ex&&T)ex=S.products.find(x=>x.name.trim().toLowerCase()===p.name.trim().toLowerCase());
      if(ex){pmap.set(p.id,ex.id);
        if(T&&tracked(p)){if(!tracked(ex)){ex.stockUnit=p.stockUnit;ex.stockFrom=p.stockFrom;ex.minStock=ex.minStock||p.minStock;ex.qopM3=ex.qopM3||p.qopM3;ex.stockBases={}}
          const inc=Object.values(p.stockBases||(p.stockBase?{w1:p.stockBase}:{})).reduce((a,b)=>a+(sgnTo(b.unit||p.stockUnit,b.val||0,ex.stockUnit,ex)||0),0);
          if(inc)setBase(ex,T,baseVal(ex,T)+inc);ex.stockFromBy={...(ex.stockFromBy||{}),[T]:p.stockFrom||0};await DB.put('products',ex)}}
      else{const np={...p};if(T&&p.stockBases){const v=Object.values(p.stockBases).reduce((a,b)=>a+(sgnTo(b.unit||p.stockUnit,b.val||0,p.stockUnit,p)||0),0);np.stockBases=v?{[T]:{unit:p.stockUnit,val:r4(v)}}:{}}
        if(!np.stockBases&&np.stockBase){np.stockBases={w1:np.stockBase};delete np.stockBase}newP.push(np);pmap.set(p.id,p.id)}}
    await DB.putMany('products',newP);S.products.push(...newP);
    const remapP=x=>({...x,productId:pmap.get(x.productId)||x.productId});
    if(T){ss=ss.map(x=>({...remapP(x),wp:T}));mm=mm.map(x=>({...remapP(x),wp:T}));dd=dd.map(x=>({...x,wp:T}))}
    const haveS=new Set(S.sales.map(x=>x.id)),haveM=new Set(S.moves.map(x=>x.id));
    const freshS=ss.filter(x=>!haveS.has(x.id)),freshM=mm.filter(x=>!haveM.has(x.id));
    if(!T){
      // records from a month already closed here are inside the stored opening balance: take them back out
      const comp=new Map();const add=(k,v)=>comp.set(k,(comp.get(k)||0)+v);
      freshS.forEach(x=>{if(!S.meta['closed:'+mKey(x.date)])return;const p=prod(x.productId);if(!tracked(p)||!saleCounts(x,p))return;const v=toUnit(x,p.stockUnit,p);if(v!=null)add(p.id+'|'+wpOf(x),v)});
      freshM.forEach(x=>{if(!S.meta['closed:'+mKey(x.date)])return;const p=prod(x.productId);if(!tracked(p))return;const v=moveVal(x,p);if(v!=null)add(p.id+'|'+wpOf(x),-v)});
      for(const [k,v] of comp){const [id,w]=k.split('|');const p=prod(id);setBase(p,w,baseVal(p,w)+v);await DB.put('products',p)}
      for(const w of (d.workplaces||[]))if(w&&w.id&&!wpById(w.id))S.wps.push(w);await saveWps();
      const cs=myCards().slice();(d.cards||[]).forEach(k=>{if(k&&k.id&&!cs.some(x=>x.id===k.id))cs.push(k)});await setMeta('cards',cs);
      for(const k of (d.closed||[]))if(!S.meta[k])await setMeta(k,1);
    }
    await DB.putMany('sales',freshS);await DB.putMany('moves',freshM);S.sales.push(...freshS);S.moves.push(...freshM);
    const haveC=new Set(S.clients.map(x=>x.id));const freshC=cc.filter(x=>!haveC.has(x.id)&&!(x.phone&&S.clients.some(y=>y.phone===x.phone)));
    await DB.putMany('clients',freshC);S.clients.push(...freshC);
    let nD=0;for(const x of dd){const i=S.debts.findIndex(y=>y.id===x.id);if(i<0||(x.updated||0)>(S.debts[i].updated||0)){await DB.put('debts',x);if(i<0){S.debts.push(x);nD++}else S.debts[i]=x}}
    if(d.shop&&!S.meta.shop)await setMeta('shop',d.shop);
    S.products.sort((a,b)=>(a.order??0)-(b.order??0));S.debts.sort((a,b)=>(b.ts||0)-(a.ts||0));
    rescheduleReminders();render();
    toast(`${T?wpName(T)+': ':'Tiklandi: '}${freshS.length} ta sotuv, ${freshM.length} ta kirim, ${nD} ta nasiya`);
  }catch(e){console.error(e);toast('Faylni o‘qishda xatolik')}
}
/* ---------- deliver files ---------- */
const CAP=window.Capacitor;const NATIVE=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform());
const plug=n=>(CAP.Plugins&&CAP.Plugins[n])||CAP.registerPlugin(n);
const b64of=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)});
async function deliverNative(files,mode){
  const FS=plug('Filesystem'),SH=plug('Share');const saved=[],uris=[];
  for(const f of files){
    const data=await b64of(f);
    if(mode==='save'){try{await FS.writeFile({path:'Muhasib/'+f.name,data,directory:'DOCUMENTS',recursive:true});saved.push(f.name);continue}catch(e){}}
    const r=await FS.writeFile({path:f.name,data,directory:'CACHE'});uris.push(r.uri);
  }
  if(uris.length){try{await SH.share({title:files.map(f=>f.name).join(', '),files:uris,dialogTitle:'Ulashish'})}catch(e){if(/cancel/i.test(String(e&&e.message)))return false}}
  if(saved.length)setTimeout(()=>toast(`Saqlandi: Documents/Muhasib/${saved.join(', ')}`),2700);
  return true;
}
async function deliver(files,mode){
  if(NATIVE)return deliverNative(files,mode);
  if(mode==='share'&&navigator.canShare){
    try{if(navigator.canShare({files})){await navigator.share({files,title:files.map(f=>f.name).join(', ')});return true}}
    catch(e){if(e&&e.name==='AbortError')return false}
  }
  for(const f of files){
    const url=URL.createObjectURL(f);const a=document.createElement('a');a.href=url;a.download=f.name;document.body.append(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},5000);await new Promise(r=>setTimeout(r,350));
  }
  return true;
}
async function exportRun(list,label,base,kinds,mode,monthK,range){
  range=range||[list.length?list[0].date:today(),list.length?list[list.length-1].date:today()];
  const mvs=S.moves.filter(m=>m.date>=range[0]&&m.date<=range[1]&&inWp(m)).sort((a,b)=>a.date===b.date?a.ts-b.ts:(a.date<b.date?-1:1));
  if(!list.length&&!mvs.length)return toast("Bu davrda yozuv yo'q");
  toast('Fayl tayyorlanmoqda…');
  await new Promise(r=>setTimeout(r,30));
  try{
    const files=[];
    if(kinds.includes('xlsx'))files.push(new File([buildXLSX(list,label,range,mvs)],base+'.xlsx',{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    if(kinds.includes('pdf'))files.push(new File([buildPDF(list,label,range)],base+'.pdf',{type:'application/pdf'}));
    if(kinds.includes('json'))files.push(new File([backupBlob(list,false,mvs)],base+'_zaxira.json',{type:'application/json'}));
    const ok=await deliver(files,mode);
    if(ok){if(monthK){await setMeta('exp:'+monthK,Date.now());if(S.view==='archive')render()}toast(mode==='share'?'Ulashildi':'Saqlandi: '+files.map(f=>f.name).join(', '))}
  }catch(e){console.error(e);toast('Xatolik: fayl yaratilmadi')}
}
