<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muhāsib</title>
<meta name="theme-color" content="#1f4d3a">
<meta name="description" content="Yog'och mahsulotlari savdosini kunma-kun hisoblash va saqlash">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muhāsib">
<style>
/* Layout: one-column phone app. Sticky spruce top bar, scrolling view, bottom tab bar, bottom sheets for forms.
   Palette: spruce green (brand), pine-resin amber (accent / money), grain tones for photo placeholders. */
:root{
  --bg:#eef1ed; --surface:#ffffff; --surface2:#f5f7f4; --ink:#17201b; --muted:#5b6862; --line:#d8dfd9;
  --spruce:#1f4d3a; --spruce-2:#2a6650; --on-spruce:#ffffff; --pine:#b9781d; --pine-soft:#f6e8cf;
  --ok:#2e7a4e; --ok-soft:#dcefe2; --warn:#9a5d12; --warn-soft:#f8e7cc; --danger:#b23a2a; --danger-soft:#f7dcd7;
  --grain1:#dcb57d; --grain2:#c4955a; --grain-ink:#5a3a12;
  --font:"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  --r:14px; --tabh:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101513; --surface:#18201c; --surface2:#1e2723; --ink:#e5ebe7; --muted:#97a59e; --line:#2b3530;
    --spruce:#173b2d; --spruce-2:#3f8f6b; --on-spruce:#eaf3ee; --pine:#e2a54b; --pine-soft:#3a2d18;
    --ok:#5bbb84; --ok-soft:#183324; --warn:#e2a54b; --warn-soft:#3a2d18; --danger:#ec7a66; --danger-soft:#3b1f1a;
    --grain1:#8a6a3f; --grain2:#6f5230; --grain-ink:#f3dfbf;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 84px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pine);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--spruce);z-index:30}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--spruce);color:var(--on-spruce);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--pine)}
.top .logo{width:34px;height:34px;border-radius:9px;flex:none;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.top .t{min-width:0;flex:1;border:0;background:none;color:inherit;text-align:left;padding:0;cursor:pointer}
.top b{display:block;font-size:17px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{display:block;opacity:.75;font-size:12px}
.top .pill{font-size:12px;background:rgba(255,255,255,.14);border-radius:99px;padding:3px 9px;white-space:nowrap}

main{max-width:720px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{height:var(--tabh);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;min-width:0;padding:0 2px}
.tabs svg{width:24px;height:24px}
.tabs button{position:relative}
.badge{position:absolute;top:7px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font:700 11px/17px var(--font);font-style:normal}
.tabs button[aria-current="page"]{color:var(--spruce-2)}
.tabs button[aria-current="page"] svg{stroke-width:2.4}
#fab{position:fixed;z-index:21;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 14px);
  border:0;border-radius:99px;background:var(--pine);color:#1e1406;font-weight:800;font-size:16px;padding:14px 22px;box-shadow:0 6px 18px rgba(0,0,0,.22)}
@media (prefers-color-scheme:dark){#fab{color:#1e1406}}

/* blocks */
.h{font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:4px 2px -4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 14px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn.pri{background:var(--spruce-2);border-color:var(--spruce-2);color:#fff}
.btn.acc{background:var(--pine);border-color:var(--pine);color:#1e1406}
.btn.dan{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.nasiya{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.chip.karta{background:var(--surface2);color:var(--spruce-2)}

/* day switcher + summary */
.day{display:flex;align-items:center;gap:8px}
.day .arrow{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;flex:none}
.day .mid{flex:1;min-width:0;position:relative;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px;min-height:44px}
.day .mid b{display:block;font-size:15px}
.day .mid small{color:var(--muted);font-size:12px}
.day .mid input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.sum{background:var(--spruce);color:var(--on-spruce);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;
  background-image:repeating-linear-gradient(176deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px)}
.sum .big{font-size:30px;font-weight:800;line-height:1.1;letter-spacing:-.5px}
.sum .big small{font-size:15px;font-weight:600;opacity:.8;margin-left:4px}
.sum .lab{font-size:12px;opacity:.75;text-transform:uppercase;letter-spacing:.6px}
.sum .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum .grid div{background:rgba(255,255,255,.08);border-radius:10px;padding:8px 10px;min-width:0}
.sum .grid b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum .pays{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;opacity:.92}
.sum .pays .n{color:#ffb4a6;font-weight:700}

.banner{display:flex;gap:12px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:12px 14px;font-size:14px;border:0;text-align:left;width:100%}
.banner b{color:var(--ink)}

/* sale list */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;width:100%}
.item .grow div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .nm{font-weight:700}
.item .ds{font-size:13px;color:var(--muted)}
.item .rt{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.item .rt b{font-size:15px}
.thumb{width:52px;height:52px;border-radius:10px;flex:none;object-fit:cover;background:var(--surface2)}
.ph{background:repeating-linear-gradient(100deg,var(--grain1) 0 6px,var(--grain2) 6px 8px,var(--grain1) 8px 15px);display:grid;place-items:center;color:var(--grain-ink);font-weight:800;font-size:18px;overflow:hidden}
.ph.saw{background:radial-gradient(circle at 20% 30%,var(--grain2) 0 2px,transparent 3px) 0 0/9px 9px,radial-gradient(circle at 70% 60%,var(--grain2) 0 1.5px,transparent 2.5px) 0 0/7px 7px,var(--grain1)}
.empty{text-align:center;padding:28px 18px;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* products grid */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ptile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;width:100%}
.ptile .img{aspect-ratio:4/3;width:100%;max-width:100%;object-fit:cover;display:block}
.ptile .ph.img{font-size:30px;display:grid}
.ptile .bd{padding:9px 10px 11px;display:flex;flex-direction:column;gap:3px;min-width:0}
.ptile .nm{font-weight:750;line-height:1.25}
.ptile .pr{font-size:12.5px;color:var(--muted)}
.ptile .pr b{color:var(--ink);font-weight:650}
.ptile.add{align-items:center;justify-content:center;min-height:170px;border-style:dashed;color:var(--muted);font-weight:700;gap:6px;background:transparent}
.ptile.add span{font-size:34px;line-height:1;color:var(--pine)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:var(--surface2)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:800;background:var(--surface2)}

/* segmented / chips select */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:650;font-size:14px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--spruce-2);border-color:var(--spruce-2);color:#fff}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.2px}
.inp{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface2);border-radius:11px;padding:11px 12px;font-size:16px;min-height:46px}
.inp:focus{outline:2px solid var(--spruce-2);outline-offset:0;background:var(--surface)}
.inp.big{font-size:20px;font-weight:750}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.suffix{position:relative}
.suffix .inp{padding-right:52px}
.suffix span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;font-weight:700;pointer-events:none}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--danger);font-weight:650}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(8,14,11,.5);opacity:0;transition:opacity .2s}
.sheet{position:relative;width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;
  transform:translateY(100%);transition:transform .22s ease-out;display:flex;flex-direction:column;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-wrap.open .scrim{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.sh-head{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sh-head h2{margin:0;font-size:18px;flex:1;min-width:0;text-wrap:balance}
.sh-head .x{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.sh-body{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.sh-foot{position:sticky;bottom:0;background:var(--bg);padding:10px 16px 0;border-top:1px solid var(--line);display:flex;gap:10px}
.prod-head{display:flex;gap:12px;align-items:center}
.prod-head .thumb{width:60px;height:60px}
.result{background:var(--pine-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.result .q{font-size:14px;color:var(--ink)}
.result .tot{font-size:26px;font-weight:850;letter-spacing:-.4px}
.result .tot small{font-size:14px;font-weight:650;margin-left:4px;color:var(--muted)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.pick .img{aspect-ratio:1;width:100%;object-fit:cover;display:block}
.pick .ph.img{font-size:24px;display:grid}
.pick span{padding:6px 8px 8px;font-size:13px;font-weight:700;line-height:1.2}
.photo-box{display:flex;gap:12px;align-items:center}
.photo-box .thumb{width:84px;height:84px}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--spruce-2)}
.urow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.urow .check{min-width:120px}
.confirm{display:flex;flex-direction:column;gap:10px;background:var(--danger-soft);border-radius:12px;padding:12px}

/* archive */
.meter{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--spruce-2);border-radius:99px}
.mcard{display:flex;flex-direction:column;gap:10px}
.mcard .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.stk{display:flex;flex-direction:column;gap:10px}
.stk .top2{display:flex;gap:12px;align-items:center}
.stk .qv{font-size:22px;font-weight:850;letter-spacing:-.3px;line-height:1.1}
.stk .qv small{font-size:13px;font-weight:650;color:var(--muted);margin-left:3px}
.stk .acts{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.stk.low{border-color:var(--warn)}.stk.out{border-color:var(--danger)}
.qneg{color:var(--danger)}
.stockline{font-size:13.5px;border-radius:10px;padding:8px 10px;background:var(--surface);border:1px solid var(--line)}
.stockline.bad{background:var(--danger-soft);color:var(--danger);border-color:transparent;font-weight:650}
.mv{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;text-align:left}
.mv .sg{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:850;flex:none}
.mv .sg.in{background:var(--ok-soft);color:var(--ok)}.mv .sg.adj{background:var(--warn-soft);color:var(--warn)}
.untr{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.untr:last-child{border-bottom:0}
/* 1.3 */
:root{--paper:#fffdf8;--ink2:#10213a}
@media (prefers-color-scheme:dark){:root{--paper:#f4efe4}}
a.btn{color:inherit;text-decoration:none}
.person .g2{grid-template-columns:minmax(0,1fr)}
@media (min-width:520px){.person .g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.breach .btn.dan{background:var(--danger);color:#fff}
.back{align-self:flex-start;border:0;background:none;color:var(--spruce-2);font-weight:700;font-size:15px;padding:4px 2px;min-height:40px}
.menu{display:flex;flex-direction:column;gap:8px}
.mitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-height:60px}
.mitem small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.mitem.on{border-color:var(--spruce-2);box-shadow:inset 3px 0 0 var(--spruce-2)}
.btn.sm{min-height:36px;padding:6px 11px;font-size:13.5px;border-radius:10px}
.req{color:var(--danger)}
.person{display:flex;flex-direction:column;gap:7px}
.person .lbl{font-size:12.5px;font-weight:700;color:var(--muted)}
.pbtns{display:flex;flex-wrap:wrap;gap:8px}
.sug{display:flex;flex-wrap:wrap;gap:6px}
.sug:empty{display:none}
.sug .chip{cursor:pointer;font-size:12.5px;padding:6px 10px;background:var(--surface)}
.block{display:flex;flex-direction:column;gap:10px}
.sub{display:flex;flex-direction:column;gap:12px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.card-pay{padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.card-pay .lbl,.disc .lbl{font-size:12.5px;font-weight:700;color:var(--muted)}
.photo-row{display:flex;gap:12px;align-items:center}
.ph-prev{width:84px;height:84px;border-radius:12px;object-fit:cover;flex:none;background:var(--surface2);border:1px solid var(--line)}
.ph-prev.none{display:grid;place-items:center;color:var(--muted)}
.sigpad{width:100%;max-width:100%;height:140px;touch-action:none;background:var(--paper);border:1.5px dashed var(--line);border-radius:12px;display:block}
.sigdone{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.sigdone img{height:56px;width:auto;flex:1;min-width:0;object-fit:contain;object-position:left}
.disc{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.dchip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 11px;font-weight:700;font-size:14px;min-height:40px;font-variant-numeric:tabular-nums}
.dchip[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#1e1406}
.dchip.add{border-style:dashed;color:var(--muted);font-weight:650}
.seg.mini button{min-height:32px;padding:4px 10px;font-size:12.5px}
.result .dl{color:var(--warn);font-weight:650}
.dtag{color:var(--warn);font-weight:700}
.note-n{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px}
.okc{color:var(--ok);font-weight:650}
.hint.bad,.bad{color:var(--danger);font-weight:650}
.banner.red{background:var(--danger-soft);color:var(--danger)}
.ayah{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;border-top:3px solid var(--pine)}
.ayah .ar{margin:0;font-family:"Amiri","Noto Naskh Arabic","Scheherazade New","Traditional Arabic",serif;font-size:21px;line-height:1.9;text-align:right}
.ayah .uz{margin:0;font-size:14px;font-style:italic}
.ayah small{color:var(--muted);font-size:12px}
.ayah.compact .ar{font-size:18px;line-height:1.7}
.ayah.compact .uz{font-size:13px}
.rules{display:flex;flex-direction:column;gap:10px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.rule dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0;font-size:13.5px}
.rule dt{color:var(--muted)}.rule dd{margin:0;font-weight:600}
.contract .csec{display:flex;flex-direction:column;gap:12px;padding-top:6px;border-top:1px solid var(--line)}
.contract h3{margin:4px 0 0;font-size:15px;letter-spacing:.2px}
.sched{display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}

<script>
(()=>{'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const UNITS={m3:{l:'m³',n:'kub metr',d:4},m2:{l:'m²',n:'kvadrat metr',d:2},pm:{l:'p.m',n:'pogon metr',d:2},dona:{l:'dona',n:'dona',d:0},qop:{l:'qop',n:'qop',d:0}};
const UORDER=['m3','m2','pm','dona','qop'];
const CATS=['Taxta','Shpunt','Reyka','Plintus','Skameyka taxtasi','Apilka / Palaxta','Boshqa'];
const PAYS={naqd:'Naqd',karta:'Karta',nasiya:'Nasiya'};
const MONTHS=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
const WDAYS=['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];

const num=v=>{if(v===null||v===undefined)return NaN;const s=String(v).replace(/[\s ]/g,'').replace(',','.');return s===''?NaN:Number(s)};
const pos=v=>{const n=num(v);return isFinite(n)&&n>0?n:0};
const sp=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const som=n=>sp(Math.round(n||0))+" so'm";
const fq=(n,d=3)=>{n=+n||0;if(!n)return '0';let s=n.toFixed(d);if(s.includes('.'))s=s.replace(/0+$/,'').replace(/\.$/,'');const [a,b]=s.split('.');return sp(a)+(b?','+b:'')};
const fqu=(n,u)=>fq(n,UNITS[u]?UNITS[u].d||0:2)+' '+(UNITS[u]?UNITS[u].l:u);
const r4=n=>Math.round((+n||0)*1e4)/1e4;

const isoDate=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>isoDate(new Date());
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return isoDate(d)};
const dmy=s=>{const [y,m,d]=s.split('-');return `${d}.${m}.${y}`};
const mKey=s=>s.slice(0,7);
const mLabel=k=>{const [y,m]=k.split('-');return `${MONTHS[+m-1]} ${y}`};
const dayLabel=s=>{const d=parseISO(s);return `${d.getDate()}-${MONTHS[d.getMonth()].toLowerCase()}`};
const wday=s=>WDAYS[parseISO(s).getDay()];
const nowTime=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};

let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---------- storage (IndexedDB) ---------- */
const DB={db:null,mem:null,
  open(){return new Promise(res=>{
    const MEM=()=>({products:new Map(),sales:new Map(),meta:new Map(),moves:new Map(),clients:new Map(),debts:new Map()});
    let r;try{r=indexedDB.open('calculator-yogoch',3)}catch(e){this.mem=MEM();return res(false)}
    r.onupgradeneeded=e=>{const db=r.result,o=e.oldVersion||0;
      if(o<1){db.createObjectStore('products',{keyPath:'id'});const s=db.createObjectStore('sales',{keyPath:'id'});s.createIndex('date','date');db.createObjectStore('meta',{keyPath:'k'})}
      if(o<2){db.createObjectStore('moves',{keyPath:'id'})}
      if(o<3){db.createObjectStore('clients',{keyPath:'id'});db.createObjectStore('debts',{keyPath:'id'})}};
    r.onsuccess=()=>{this.db=r.result;res(true)};
    r.onerror=()=>{this.mem=MEM();res(false)};
  })},
  key(store,v){return store==='meta'?v.k:v.id},
  tx(store,mode,fn){
    if(this.mem){return Promise.resolve(fn(null))}
    return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const s=t.objectStore(store);let out;const q=fn(s);if(q&&'onsuccess' in q)q.onsuccess=()=>{out=q.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('abort'))})},
  all(store){return this.mem?Promise.resolve([...this.mem[store].values()]):this.tx(store,'readonly',s=>s.getAll())},
  put(store,v){if(this.mem){this.mem[store].set(this.key(store,v),v);return Promise.resolve()}return this.tx(store,'readwrite',s=>s.put(v))},
  putMany(store,vals){if(this.mem){vals.forEach(v=>this.mem[store].set(this.key(store,v),v));return Promise.resolve()}return this.tx(store,'readwrite',s=>{vals.forEach(v=>s.put(v))})},
  del(store,k){if(this.mem){this.mem[store].delete(k);return Promise.resolve()}return this.tx(store,'readwrite',s=>s.delete(k))},
  delMany(store,keys){if(this.mem){keys.forEach(k=>this.mem[store].delete(k));return Promise.resolve()}return this.tx(store,'readwrite',s=>{keys.forEach(k=>s.delete(k))})},
};

const S={products:[],sales:[],moves:[],clients:[],debts:[],wps:[],wp:'all',meta:{},view:'today',dFilter:'active',day:today(),rep:{preset:'month',from:'',to:''}};
const prod=id=>S.products.find(p=>p.id===id);
const setMeta=(k,v)=>{S.meta[k]=v;return DB.put('meta',{k,v})};

/* ---------- workplaces (ish joylari) ---------- */
const wpOf=x=>(x&&x.wp)||'w1';
const wpById=id=>S.wps.find(w=>w.id===id);
const wpName=id=>(wpById(id)||{name:'—'}).name;
const multiWp=()=>S.wps.length>1;
const inWp=(x,w=S.wp)=>w==='all'||wpOf(x)===w;
const curWp=()=>S.wp==='all'?S.wps[0].id:S.wp;
const scopeLabel=()=>S.wp==='all'?(multiWp()?`Barcha ish joylari (${S.wps.length})`:S.wps[0].name):wpName(S.wp);
async function saveWps(){await setMeta('workplaces',S.wps)}
const wpField=f=>multiWp()?`<div class="field"><span class="lbl">Ish joyi</span><div class="seg" role="group">${S.wps.map(w=>`<button type="button" data-wpf="${w.id}" aria-pressed="${f.wp===w.id}">${esc(w.name)}</button>`).join('')}</div></div>`:'';
const bindWpField=(c,f,after)=>$$('[data-wpf]',c).forEach(b=>b.onclick=()=>{f.wp=b.dataset.wpf;$$('[data-wpf]',c).forEach(x=>x.setAttribute('aria-pressed',x===b));after&&after()});

const SEED=[
  ['Taxta','Taxta',{m3:0}],
  ['Shpunt','Shpunt',{m2:0}],
  ['Reyka','Reyka',{pm:0,dona:0}],
  ['Plintus','Plintus',{pm:0,dona:0}],
  ['Skameyka taxtasi','Skameyka taxtasi',{dona:0}],
  ['Apilka mayin','Apilka / Palaxta',{qop:0,m3:0}],
  ["Apilka yo'g'on",'Apilka / Palaxta',{qop:0,m3:0}],
];

async function load(){
  const ok=await DB.open();
  if(!ok)setTimeout(()=>toast("Diqqat: xotira ochilmadi, ma'lumot saqlanmaydi"),600);
  S.products=await DB.all('products');S.sales=await DB.all('sales');S.moves=await DB.all('moves');S.clients=await DB.all('clients');S.debts=await DB.all('debts');
  (await DB.all('meta')).forEach(x=>S.meta[x.k]=x.v);
  if(!S.meta.seeded){
    const t=Date.now();
    const ps=SEED.map((s,i)=>({id:uid('p'),name:s[0],cat:s[1],prices:s[2],t:'',w:'',l:'',photo:'',order:i,created:t}));
    await DB.putMany('products',ps);S.products=ps;await setMeta('seeded',1);
  }
  S.products.sort((a,b)=>(a.order??0)-(b.order??0));
  S.wps=Array.isArray(S.meta.workplaces)&&S.meta.workplaces.length?S.meta.workplaces:[{id:'w1',name:S.meta.shop||'Asosiy',manager:'',phone:'',addr:''}];
  if(!S.meta.workplaces)await saveWps();
  S.wp=S.meta.curWp&&(S.meta.curWp==='all'||wpById(S.meta.curWp))?S.meta.curWp:(multiWp()?'all':S.wps[0].id);
  // 1.2 -> 1.3: single stock base becomes per-workplace
  const pf=[];S.products.forEach(p=>{if(p.stockBase&&!p.stockBases){p.stockBases={w1:p.stockBase};delete p.stockBase;pf.push(p)}});
  if(pf.length)await DB.putMany('products',pf);
  S.debts.sort((a,b)=>(b.ts||0)-(a.ts||0));
}

/* ---------- calculation ---------- */
function hasDims(p){return pos(p.t)&&pos(p.w)&&pos(p.l)}
function modesFor(u){if(u==='m3')return['pieces','direct','kuzov'];if(u==='m2'||u==='pm')return['pieces','direct'];return['direct']}
const MODE_L={pieces:'Donalab',direct:"To'g'ridan",kuzov:'Kuzov (yuklab)'};

function calc(f){
  const u=f.unit,t=pos(f.t),w=pos(f.w),l=pos(f.l);
  let n=0,qty=0,m3=0,m2=0,pm=0;
  if(f.mode==='kuzov'){m3=pos(f.a)*pos(f.b)*pos(f.c);qty=m3}
  else if(f.mode==='pieces'||u==='dona'){
    n=f.mode==='pieces'?pos(f.pieces):pos(f.direct);
    if(t&&w&&l)m3=n*t*w*l/1e6; if(w&&l)m2=n*w*l/1000; if(l)pm=n*l;
    qty=({m3,m2,pm,dona:n,qop:n})[u]||0;
  }else{
    qty=pos(f.direct);
    if(u==='m3')m3=qty;
    if(u==='m2'){m2=qty;if(t)m3=qty*t/1000}
    if(u==='pm'){pm=qty;if(w)m2=qty*w/1000;if(t&&w)m3=qty*t*w/1e6}
  }
  qty=r4(qty);m3=r4(m3);m2=r4(m2);pm=r4(pm);
  const price=pos(f.price),calcSum=Math.round(qty*price),ov=Math.round(pos(f.override));
  return {n,qty,m3,m2,pm,price,calcSum,override:ov,total:ov||calcSum};
}

function describe(s){
  if(s.mode==='kuzov')return `Kuzov ${fq(s.a,2)}×${fq(s.b,2)}×${fq(s.c,2)} m`;
  if(s.mode==='pieces'){const d=[s.t&&fq(s.t,1),s.w&&fq(s.w,1)].filter(Boolean).join('×');return `${sp(s.n)} dona`+(d?` · ${d} mm`:'')+(pos(s.l)?` × ${fq(s.l,2)} m`:'')}
  return fqu(s.qty,s.unit);
}
function totals(list){
  const t={sum:0,n:list.length,m3:0,m2:0,pay:{naqd:0,karta:0,nasiya:0}};
  list.forEach(s=>{t.sum+=s.total;t.m3+=s.m3||0;t.m2+=s.m2||0;t.pay[s.pay||'naqd']+=s.total});
  return t;
}
function report(list){
  const tot=totals(list),bp=new Map(),bd=new Map();
  list.forEach(s=>{
    const k=s.productId+'|'+s.unit;
    const r=bp.get(k)||{pid:s.productId,name:s.productName,unit:s.unit,qty:0,n:0,sum:0,m3:0,m2:0};
    r.qty+=s.qty;r.n++;r.sum+=s.total;r.m3+=s.m3||0;r.m2+=s.m2||0;bp.set(k,r);
    const d=bd.get(s.date)||{date:s.date,n:0,sum:0,m3:0,m2:0,nasiya:0};
    d.n++;d.sum+=s.total;d.m3+=s.m3||0;d.m2+=s.m2||0;if(s.pay==='nasiya')d.nasiya+=s.total;bd.set(s.date,d);
  });
  return {tot,byP:[...bp.values()].sort((a,b)=>b.sum-a.sum),byD:[...bd.values()].sort((a,b)=>a.date<b.date?-1:1)};
}
const sortSales=list=>list.slice().sort((a,b)=>a.date===b.date?a.ts-b.ts:(a.date<b.date?-1:1));

/* ---------- stock (qoldiq) ---------- */
// best-known amounts of one record (sale or stock move) in every unit, using product dimensions
function measures(rec,p){
  p=p||{};const t=pos(p.t),w=pos(p.w),l=pos(p.l),q=pos(p.qopM3);
  let m3=rec.unit==='m3'?pos(rec.qty):pos(rec.m3),m2=rec.unit==='m2'?pos(rec.qty):pos(rec.m2),pm=rec.unit==='pm'?pos(rec.qty):pos(rec.pm);
  let dona=rec.unit==='dona'?pos(rec.qty):(rec.mode==='pieces'?pos(rec.n):0),qop=rec.unit==='qop'?pos(rec.qty):0;
  if(!m3&&qop&&q)m3=qop*q;
  if(!m3&&dona&&t&&w&&l)m3=dona*t*w*l/1e6;
  if(!m3&&m2&&t)m3=m2*t/1000;
  if(!m3&&pm&&t&&w)m3=pm*t*w/1e6;
  if(!m2&&m3&&t)m2=m3*1000/t;
  if(!m2&&pm&&w)m2=pm*w/1000;
  if(!pm&&m2&&w)pm=m2*1000/w;
  if(!dona&&m3&&t&&w&&l)dona=m3/(t*w*l/1e6);
  if(!qop&&m3&&q)qop=m3/q;
  return {m3,m2,pm,dona,qop};
}
function toUnit(rec,unit,p){if(!pos(rec.qty))return 0;if(rec.unit===unit)return pos(rec.qty);const v=measures(rec,p)[unit];return v>0?v:null}
function sgnTo(fromUnit,val,unit,p){val=+val||0;if(!val)return 0;const x=toUnit({unit:fromUnit,qty:Math.abs(val)},unit,p);return x==null?null:Math.sign(val)*x}
const tracked=p=>!!(p&&p.stockUnit);
const saleCounts=(s,p)=>s.productId===p.id&&(s.ts||0)>=((p.stockFromBy&&p.stockFromBy[wpOf(s)])??(p.stockFrom||0));
const moveVal=(m,p)=>{const x=toUnit(m,p.stockUnit,p);return x==null?null:x*(m.sign||1)};
const baseOne=(p,b)=>b?(sgnTo(b.unit||p.stockUnit,b.val||0,p.stockUnit,p)||0):0;
const baseVal=(p,w=S.wp)=>{const bs=p.stockBases||{};return w==='all'?Object.values(bs).reduce((a,b)=>a+baseOne(p,b),0):baseOne(p,bs[w])};
const setBase=(p,w,val)=>{p.stockBases={...(p.stockBases||{}),[w]:{unit:p.stockUnit,val:r4(val)}}};
function stockOf(p,upto,w=S.wp){
  if(!tracked(p))return null;
  const u=p.stockUnit,base=baseVal(p,w);let inn=0,out=0,adj=0,skip=0;
  S.moves.forEach(m=>{if(m.productId!==p.id||!inWp(m,w)||(upto&&m.date>upto))return;const x=moveVal(m,p);if(x==null){skip++;return}if(m.type==='in')inn+=x;else adj+=x});
  S.sales.forEach(s=>{if(!saleCounts(s,p)||!inWp(s,w)||(upto&&s.date>upto))return;const x=toUnit(s,u,p);if(x==null){skip++;return}out+=x});
  return {u,base,inn,out,adj,skip,val:r4(base+inn+adj-out)};
}
function periodStock(p,from,to,w=S.wp){const a=stockOf(p,addDays(from,-1),w),b=stockOf(p,to,w),n=stockOf(p,null,w);
  return {p,u:p.stockUnit,open:a.val,inn:r4(b.inn-a.inn),out:r4(b.out-a.out),adj:r4(b.adj-a.adj),close:b.val,now:n.val,skip:n.skip}}
function stockState(p,st){if(!st)return null;const min=pos(p.minStock);if(st.val<=0)return 'out';if(min&&st.val<=min)return 'low';return 'ok'}
const STATE_CHIP={out:'<span class="chip nasiya">Tugagan</span>',low:'<span class="chip warn">Kam qoldi</span>',ok:'<span class="chip ok">Bor</span>'};
function approxPieces(p,st){if(!st||p.stockUnit==='dona'||st.val<=0)return '';const d=measures({unit:p.stockUnit,qty:st.val},p).dona;return d?`≈ ${sp(Math.floor(d+1e-6))} dona`:''}
async function foldMonth(k){
  const ch=new Set();
  S.products.forEach(p=>{if(!tracked(p))return;
    S.wps.forEach(({id:w})=>{let d=0;
      S.moves.forEach(m=>{if(m.productId===p.id&&wpOf(m)===w&&mKey(m.date)===k){const x=moveVal(m,p);if(x!=null)d+=x}});
      S.sales.forEach(s=>{if(saleCounts(s,p)&&wpOf(s)===w&&mKey(s.date)===k){const x=toUnit(s,p.stockUnit,p);if(x!=null)d-=x}});
      if(d){setBase(p,w,baseVal(p,w)+d);ch.add(p)}})});
  if(ch.size)await DB.putMany('products',[...ch]);
}
/* ---------- photo ---------- */
async function compress(file,max=480,q=0.72){
  let src;
  try{src=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){
    src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});
  }
  const w=src.width,h=src.height,k=Math.min(1,max/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',q);
}
function thumbHTML(p,cls='thumb',fallbackName){
  if(p&&p.photo)return `<img class="${cls}" src="${p.photo}" alt="">`;
  const name=(p&&p.name)||fallbackName||'?';const saw=p&&/apilka|palaxta/i.test((p.cat||'')+' '+name);
  return `<div class="${cls} ph${saw?' saw':''}" aria-hidden="true">${esc(name.trim().charAt(0).toUpperCase())}</div>`;
}

function periodOf(pr){
  const td=today(),d=parseISO(td);
  if(pr==='today')return [td,td,'Bugun, '+dmy(td)];
  if(pr==='week'){const k=(d.getDay()+6)%7;const f=addDays(td,-k);return [f,td,`${dmy(f)} – ${dmy(td)}`]}
  if(pr==='month'){const f=td.slice(0,8)+'01';return [f,td,mLabel(mKey(td))]}
  if(pr==='year'){const f=td.slice(0,4)+'-01-01';return [f,td,td.slice(0,4)+'-yil']}
  if(pr==='prev'){const p=new Date(d.getFullYear(),d.getMonth()-1,1);const f=isoDate(p);const l=isoDate(new Date(d.getFullYear(),d.getMonth(),0));return [f,l,mLabel(mKey(f))]}
  const f=S.rep.from||td.slice(0,8)+'01',t=S.rep.to||td;return [f,t,`${dmy(f)} – ${dmy(t)}`];
}

function nasiyaSummary(from,to){
  const ds=S.debts.filter(d=>inWp(d)&&d.status!=='draft');let got=0;
  ds.forEach(d=>{(d.payments||[]).forEach(p=>{if(p.date>=from&&p.date<=to)got+=+p.amount||0})});

  return {got,left:open.reduce((a,d)=>a+debtLeft(d),0),count:open.length,late,list:ds};
}

async function storageInfo(){
  try{
    if(!navigator.storage||!navigator.storage.estimate){$('#storTxt').textContent='';return}
    const e=await navigator.storage.estimate();const mb=x=>(x/1048576).toFixed(1).replace('.',',');

    const pct=e.quota?Math.max(1,Math.min(100,(e.usage/e.quota)*100*20)):0; // magnified: real quota is huge
    $('#storBar').style.width=Math.min(100,((e.usage||0)/(50*1048576))*100).toFixed(1)+'%';
    void pct;
  }catch(err){}
}

function setupStep(api,p,after){
  api.title((tracked(p)?'Qoldiq sozlamasi: ':'Qoldiqni hisoblash: ')+p.name);
  const units=[...new Set([...Object.keys(p.prices||{}).filter(u=>UNITS[u]),p.stockUnit].filter(Boolean))];if(!units.length)units.push('dona');
  const f={unit:p.stockUnit||units[0],qty:'',min:p.minStock||'',qop:p.qopM3||'',wp:curWp()};
  const hasQop=units.includes('qop')||/apilka|palaxta/i.test((p.cat||'')+p.name);
  const draw=()=>{
    const u=UNITS[f.unit].l;
    api.content.innerHTML=`<div class="sh-body">
      <p class="hint" style="margin:0">Qoldiq bitta birlikda sanaladi. Boshqa birlikda sotilsa (masalan, dona sotilib, qoldiq m³ da bo'lsa), tovar o'lchami bo'yicha o'zi o'giriladi.</p>
      <div class="field"><span class="lbl">Qoldiq qaysi birlikda sanaladi</span><div class="seg" role="group">${units.map(x=>`<button type="button" data-su="${x}" aria-pressed="${f.unit===x}">${UNITS[x].n}</button>`).join('')}</div></div>
      ${tracked(p)?'':wpField(f)+numField('sQty',`Hozir omborda bor (${u})`,f.qty,u,'decimal','0')}
      ${numField('sMin',`Kam qolganda ogohlantirish (${u}, ixtiyoriy)`,f.min,u,'decimal','masalan 1')}
      ${hasQop?numField('sQop','1 qop taxminan necha m³? (ixtiyoriy)',f.qop,'m³','decimal','masalan 0,05')+'<div class="hint">Shunda qopda va yuklab (m³) sotilgan apilka bitta qoldiqdan ayriladi.</div>':''}
      ${hasDims(p)?`<div class="hint num">O'lcham: ${fq(p.t,1)}×${fq(p.w,1)} mm × ${fq(p.l,2)} m · 1 m³ ≈ ${fq(1e6/(p.t*p.w*p.l),1)} dona</div>`:`<div class="hint">Maslahat: «Tovarlar» bo'limida o'lcham kiritsangiz, dona ↔ m³ ↔ m² o'zi o'giriladi.</div>`}
      <div class="err" id="sErr" hidden></div>
      ${tracked(p)?`<button class="btn dan" type="button" id="sOff">Qoldiq hisobini to'xtatish</button><div class="confirm" id="sOffC" hidden><b>Qoldiq hisobi to'xtatilsinmi?</b><span class="hint">Sotuvlar o'chmaydi. Kirim yozuvlari ro'yxatda qoladi.</span><div class="g2"><button class="btn" type="button" id="sOffN">Yo'q</button><button class="btn dan" type="button" id="sOffY">Ha, to'xtatish</button></div></div>`:''}
    </div><div class="sh-foot"><button class="btn pri block" type="button" id="sSave">${after?'Davom etish':'Saqlash'}</button></div>`;
    const c=api.content;
    $$('[data-su]',c).forEach(b=>b.onclick=()=>{f.unit=b.dataset.su;draw()});bindWpField(c,f);
    [['sQty','qty'],['sMin','min'],['sQop','qop']].forEach(([id,k])=>{const el=$('#'+id,c);if(el)el.oninput=()=>{f[k]=el.value}});
    const off=$('#sOff',c);if(off){off.onclick=()=>{$('#sOffC',c).hidden=false};$('#sOffN',c).onclick=()=>{$('#sOffC',c).hidden=true};
      $('#sOffY',c).onclick=async()=>{const p2={...p,stockUnit:'',stockBases:null};await saveProduct(p2);closeSheet();render();toast("Qoldiq hisobi to'xtatildi")}}
    $('#sSave',c).onclick=async()=>{
      const err=$('#sErr',c);const p2={...p,minStock:pos(f.min)||'',qopM3:pos(f.qop)||''};
      if(!tracked(p)){
        p2.stockUnit=f.unit;p2.stockFrom=Date.now();p2.stockBases={};await saveProduct(p2);
        const q=pos(f.qty);
        if(q){const m={id:uid('m'),ts:Date.now(),date:today(),wp:f.wp,productId:p.id,productName:p.name,type:'start',unit:f.unit,mode:'direct',qty:r4(q),sign:1,note:''};await DB.put('moves',m);S.moves.push(m)}
      }else{
        if(f.unit!==p.stockUnit){
          const now=S.wps.map(w=>[w.id,sgnTo(p.stockUnit,stockOf(p,null,w.id).val,f.unit,p2)]);
          if(now.some(x=>x[1]===null)){err.textContent=`${UNITS[p.stockUnit].n} → ${UNITS[f.unit].n} o'girish uchun tovar o'lchamini kiriting.`;err.hidden=false;return}
          // re-anchor every workplace: keep today's quantity, recomputed in the new unit
          p2.stockUnit=f.unit;const tmp={...p2,stockBases:{}};const idx=S.products.findIndex(x=>x.id===p.id);S.products[idx]=tmp;
          p2.stockBases={};now.forEach(([w,b])=>{p2.stockBases[w]={unit:f.unit,val:r4(b-stockOf(tmp,null,w).val)}});
        }
        await saveProduct(p2);
      }
      if(after)after();else{closeSheet();render();toast('Saqlandi')}
    };
  };
  draw();
}
async function saveProduct(p){await DB.put('products',p);const i=S.products.findIndex(x=>x.id===p.id);if(i>=0)S.products[i]=p;else S.products.push(p)}

function moveSheet(mv,presetPid){

function fmtPhone(s){const n=normPhone(s);const m=n.match(/^\+998(\d{2})(\d{3})(\d{2})(\d{2})$/);return m?`+998 ${m[1]} ${m[2]} ${m[3]} ${m[4]}`:String(s||'').trim()}
const telHref=s=>'tel:'+normPhone(s);
const ago=ts=>{const d=new Date(ts),t=today(),k=daysBetweenISO(isoDate(d),t);const hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');return k===0?'bugun '+hm:k===1?'kecha '+hm:`${k} kun oldin`};
function daysBetweenISO(a,b){return Math.round((parseISO(b)-parseISO(a))/864e5)}
function addMonths(iso,n){const [y,m,d]=iso.split('-').map(Number);const last=new Date(y,m-1+n+1,0).getDate();return isoDate(new Date(y,m-1+n,Math.min(d,last)))}

const clientByPhone=(ph,role)=>{const n=normPhone(ph);return n?S.clients.find(c=>c.phone===n&&(!role||(c.role||'client')===role))||S.clients.find(c=>c.phone===n):null};
async function upsertClient({name,phone,address,role='client'}){
  name=String(name||'').trim();const ph=normPhone(phone);if(!name&&!ph)return null;
  let c=ph?S.clients.find(x=>x.phone===ph):S.clients.find(x=>!x.phone&&x.name.toLowerCase()===name.toLowerCase());
  const roles=new Set([...(c&&c.roles||[c&&c.role||role]),role]);
  c=c?{...c,name:name||c.name,phone:ph||c.phone,address:address||c.address||'',roles:[...roles],updated:Date.now()}:{id:uid('c'),name,phone:ph,address:address||'',roles:[role],created:Date.now(),updated:Date.now()};
  await DB.put('clients',c);const i=S.clients.findIndex(x=>x.id===c.id);if(i>=0)S.clients[i]=c;else S.clients.push(c);return c;
}

  };
  const showSug=q=>{q=String(q).trim().toLowerCase();const qd=digits(q);if(q.length<2){sg.innerHTML='';return}

function mountSig(box,o){
  const draw=()=>{
    box.innerHTML=`<div class="field"><span class="lbl">${o.label}${o.req?' <span class="req">*</span>':''}</span>${o.value?`<div class="sigdone"><img src="${o.value}" alt="Imzo"><button class="btn sm ghost" type="button" data-sx>Qayta imzolash</button></div>`:
      `<canvas class="sigpad" width="900" height="300" aria-label="Imzo maydoni"></canvas><div class="row"><span class="hint grow">Barmoq bilan imzo chizing</span><button class="btn sm ghost" type="button" data-sc>Tozalash</button></div>`}</div>`;
    if(o.value){box.querySelector('[data-sx]').onclick=()=>{o.value='';o.onChange('');draw()};return}
    const cv=box.querySelector('canvas'),ctx=cv.getContext('2d');let on=false,last=null;
    ctx.lineWidth=6;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#10213a';
    const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
    cv.onpointerdown=e=>{on=true;last=pt(e);try{cv.setPointerCapture(e.pointerId)}catch(er){}ctx.beginPath();ctx.arc(last[0],last[1],2.5,0,7);ctx.fillStyle='#10213a';ctx.fill();e.preventDefault()};
    cv.onpointermove=e=>{if(!on)return;const p=pt(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;e.preventDefault()};
    cv.onpointerup=cv.onpointercancel=()=>{if(!on)return;on=false;o.value=cv.toDataURL('image/png');o.onChange(o.value)};
    box.querySelector('[data-sc]').onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);o.value='';o.onChange('')};
  };draw();
}

/* ---------- own cards and card payments ---------- */
const cardDigits=s=>digits(s).slice(0,19);
const fmtCard=s=>cardDigits(s).replace(/(\d{4})(?=\d)/g,'$1 ');
const maskCard=s=>{const d=cardDigits(s);return d.length>=8?d.slice(0,4)+' •••• '+d.slice(-4):fmtCard(s)};
function cardBank(s){const d=cardDigits(s);if(/^(8600|5614)/.test(d))return 'Uzcard';if(/^9860/.test(d))return 'Humo';if(/^220[0-4]/.test(d))return 'Mir';if(/^4/.test(d))return 'Visa';if(/^(5[1-5]|2[2-7])/.test(d))return 'Mastercard';if(/^62/.test(d))return 'UnionPay';return ''}
function luhn(s){const d=cardDigits(s);if(d.length<13)return false;let sum=0,alt=false;for(let i=d.length-1;i>=0;i--){let n=+d[i];if(alt){n*=2;if(n>9)n-=9}sum+=n;alt=!alt}return sum%10===0}
const myCards=()=>S.meta.cards||[];
const cardById=id=>myCards().find(c=>c.id===id);
const cardLabel=c=>c?`${c.label||cardBank(c.number)||'Karta'} · ${maskCard(c.number).slice(-4)}`:'';
const defaultCardFor=w=>{const cs=myCards();return (cs.find(c=>c.wp===w)||cs[0]||{}).id||''};
async function scanCardNumber(file){
  const b=await compress(file,1600,0.88);
  const r=await plug('PhoneBook').recognizeText({base64:b.split(',')[1]});
  const t=String(r.text||'').replace(/[OoОо]/g,'0').replace(/[Il|]/g,'1');
  const cands=(t.match(/\d[\d \-]{11,24}\d/g)||[]).map(digits).filter(x=>x.length>=16&&x.length<=19);
  let best=cands.find(luhn)||'';
  if(!best){const all=digits(t);for(let i=0;i+16<=all.length;i++){const s=all.slice(i,i+16);if(luhn(s)&&/^(8600|5614|9860|4|5|2|62)/.test(s)){best=s;break}}}
  return best||cands[0]||'';
}
function smsAmount(text){
  const t=String(text||'');const out=[];
  const re=/(\d{1,3}(?:[  .,]\d{3})+|\d{4,})(?:[.,](\d{1,2}))?\s*(?:uzs|so['ʻ‘’`]?m|сум|sum)/gi;let m;
  while((m=re.exec(t)))out.push(+digits(m[1]));
  return out;
}

/* ---------- discounts ---------- */
function discSteps(x){if(!(x>0))return [];const m=Math.pow(10,Math.max(0,Math.floor(Math.log10(x))-2));return [m,5*m,10*m,20*m]}
function parseDisc(str){const s=String(str||'').trim();if(!s)return null;if(/%$/.test(s)){const v=num(s.replace('%',''));return v>0&&v<100?{kind:'pct',v}:null}const v=pos(s);return v?{kind:'sum',v}:null}
function discAmount(f,r){
  const d=f.disc;if(!d||!r.qty||!r.calcSum)return {amount:0,unitPrice:r.price};
  let amount=0;
  if(d.kind==='round'){amount=r.calcSum-Math.floor(r.calcSum/d.v)*d.v}
  else if(f.discOn==='unit'){const per=d.kind==='pct'?r.price*d.v/100:d.v;amount=Math.round(per*r.qty)}
  else amount=d.kind==='pct'?Math.round(r.calcSum*d.v/100):Math.round(d.v);
  amount=Math.max(0,Math.min(amount,r.calcSum));
  return {amount,unitPrice:r.qty?(r.calcSum-amount)/r.qty:r.price};
}

const debtPaid=d=>(d.payments||[]).reduce((a,p)=>a+(+p.amount||0),0);
const debtLeft=d=>Math.max(0,Math.round((+d.total||0)-(+d.down||0)-debtPaid(d)));
function instRows(d){
  let pool=debtPaid(d);const td=today();
  return (d.schedule||[]).slice().sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0).map(it=>{
    const cov=Math.min(+it.amount||0,pool);pool-=cov;const left=Math.round((+it.amount||0)-cov);const dd=daysBetweenISO(td,it.due);
    const st=left<=0?'paid':it.breach?'breach':dd<0?'overdue':dd===0?'today':dd<=3?'soon':'later';
    return {...it,cov,left,st,dd};
  });
}
const debtNext=d=>instRows(d).find(x=>x.left>0)||null;
function debtState(d){
  if(d.status==='draft')return 'draft';
  if(debtLeft(d)<=0)return 'closed';
  const rows=instRows(d);
  if(rows.some(x=>x.st==='breach'))return 'breached';
  if(rows.some(x=>x.st==='overdue'||x.st==='today'))return 'due';
  if(rows.some(x=>x.st==='soon'))return 'soon';
  return 'active';
}

function debtItem(d){
  const nx=debtNext(d),left=debtLeft(d);
  return `<button class="item debt" type="button" data-debt="${d.id}">${d.face?`<img class="thumb round" src="${d.face}" alt="">`:`<div class="thumb round ph" aria-hidden="true">${esc((d.client.name||'?').trim().charAt(0).toUpperCase()||'?')}</div>`}
    <div class="grow"><div class="nm">${esc(d.client.name||'Mijoz')}</div><div class="ds num">${esc(fmtPhone(d.client.phone))}${d.client.phone?' · ':''}${esc(d.no)}${S.wp==='all'&&multiWp()?' · '+esc(wpName(d.wp)):''}</div>
    <div class="ds num">${debtState(d)==='closed'?`Yopildi: ${d.closedAt?dmy(isoDate(new Date(d.closedAt))):''}`:nx?`Keyingi: ${dmy(nx.due)} · ${som(nx.left)}`:''}</div></div>
    <div class="rt"><b class="num">${sp(left)}</b>${debtChip(d)}</div></button>`;
}
function vNasiya(){
  const ds=S.debts.filter(d=>inWp(d));
  const open=ds.filter(d=>debtState(d)!=='closed');
  const left=open.reduce((a,d)=>a+debtLeft(d),0);
  const nDue=open.filter(d=>['due','breached'].includes(debtState(d))).length,nSoon=open.filter(d=>debtState(d)==='soon').length;
  const F=S.dFilter;const ord=d=>{const n=debtNext(d);return n?n.due:'9999'};
  let list=F==='active'?open:F==='due'?open.filter(d=>['due','breached','soon','draft'].includes(debtState(d))):F==='closed'?ds.filter(d=>debtState(d)==='closed'):ds;
  list=list.slice().sort((a,b)=>F==='closed'?(b.closedAt||0)-(a.closedAt||0):ord(a)<ord(b)?-1:ord(a)>ord(b)?1:0);
  const FL=[['active','Faol'],['due','Muddati yaqin'],['closed','Yopilgan'],['all','Hammasi']];
  $('#view').innerHTML=`${ayahHTML('compact')}
  <section class="sum"><div><div class="lab">Nasiya qoldig‘i · ${esc(scopeLabel())}</div><div class="big num">${sp(left)}<small>so'm</small></div></div>
    <div class="grid num"><div><span class="lab">Faol</span><b>${open.length} ta</b></div><div><span class="lab">Muddati keldi</span><b>${nDue} ta</b></div><div><span class="lab">3 kun ichida</span><b>${nSoon} ta</b></div></div></section>
  <div class="seg" role="group" aria-label="Saralash">${FL.map(([k,v])=>`<button type="button" data-df="${k}" aria-pressed="${F===k}">${v}</button>`).join('')}</div>
  ${list.length?`<div class="list">${list.map(debtItem).join('')}</div>`:`<div class="empty"><b>${F==='closed'?'Yopilgan nasiya yo‘q':'Faol nasiya yo‘q'}</b>Nasiyaga sotish uchun «+ Nasiya» tugmasini bosing yoki sotuvda to‘lov turini «Nasiya» qiling.</div>`}
  <button class="btn ghost" type="button" id="nRules">Nasiya savdosi qoidalari (qonun va shariat)</button>`;
  $$('[data-df]').forEach(b=>b.onclick=()=>{S.dFilter=b.dataset.df;render()});
  $$('[data-debt]').forEach(b=>b.onclick=()=>debtView(S.debts.find(x=>x.id===b.dataset.debt)));
  $('#nRules').onclick=nasiyaRulesSheet;
}

function debtSheet(d0,isNew){
  const f=JSON.parse(JSON.stringify(d0));
  f.client=f.client||{};f.guarantor=f.guarantor||{};f.sig=f.sig||{};f.schedule=f.schedule||[];
  f.plan=f.plan||{mode:f.schedule.length>1?'monthly':'once',count:Math.max(2,f.schedule.length||3),first:(f.schedule[0]&&f.schedule[0].due)||addMonths(f.date,1)};
  f.client.phone=f.client.phone?fmtPhone(f.client.phone):'';f.guarantor.phone=f.guarantor.phone?fmtPhone(f.guarantor.phone):'';
  if(!f.sig.seller&&S.meta.sellerSig)f.sig.seller=S.meta.sellerSig;
  const wasActive=f.status==='active';
  openSheet(`Nasiya shartnomasi · ${f.no}`,api=>{
    const c=api.content;
    const rem=()=>Math.max(0,Math.round(f.total-pos(f.down)));
    const gen=()=>{const R=rem();if(f.plan.mode==='once'){f.schedule=[{id:(f.schedule[0]&&f.schedule[0].id)||uid('i'),due:f.plan.first,amount:R}];return}
      const n=Math.max(2,Math.min(36,Math.round(pos(f.plan.count)||2)));const base=Math.floor(R/n/1000)*1000;f.schedule=[];
      for(let i=0;i<n;i++)f.schedule.push({id:uid('i'),due:addMonths(f.plan.first,i),amount:i<n-1?base:R-base*(n-1)})};
    if(!f.schedule.length)gen();
    c.innerHTML=`<div class="sh-body contract">
      ${ayahHTML('compact')}
      ${wasActive?'<div class="note-n">Shartnoma imzolangan. Summa yoki muddatni o‘zgartirsangiz, imzolarni qaytadan oling.</div>':''}
      <section class="csec"><h3>1. Mahsulot</h3>
        <div class="list">${f.items.map(it=>`<div class="item static"><div class="grow"><div class="nm">${esc(it.name)}</div><div class="ds num">${esc(it.desc)} · ${fqu(it.qty,it.unit)} × ${sp(it.price)}</div></div><b class="num">${sp(it.sum)}</b></div>`).join('')}</div>
        <div class="field"><label for="dDescr">To‘liq tavsif (navi, o‘lchami, holati, rangi…)</label><textarea class="inp" id="dDescr" rows="3" placeholder="Masalan: qarag‘ay, 1-nav, quruq, 25×150×6000 mm, 40 dona">${esc(f.descr)}</textarea></div>
        <div class="g2">${numField('dCash','Naqd narxi (ixtiyoriy)',f.cashPrice?sp(f.cashPrice):'',"so'm",'numeric','agar farq qilsa')}${numField('dDown','Oldindan to‘lov',f.down?sp(f.down):'',"so'm",'numeric','0')}</div>
        <div class="result"><div class="q num">Nasiya narxi: <b>${som(f.total)}</b></div><div class="q num" id="dRem"></div></div>
      </section>
      <section class="csec"><h3>2. To‘lov jadvali</h3>
        <div class="seg" role="group"><button type="button" data-pm="once" aria-pressed="${f.plan.mode==='once'}">Bir martada</button><button type="button" data-pm="monthly" aria-pressed="${f.plan.mode==='monthly'}">Oyma-oy bo‘lib</button></div>
        <div class="g2"><div class="field"><label for="dFirst">${f.plan.mode==='once'?'To‘lov sanasi':'Birinchi to‘lov'}</label><input class="inp" type="date" id="dFirst" value="${f.plan.first}" min="${f.date}"></div>
          ${f.plan.mode==='monthly'?numField('dCount','Necha oyga',f.plan.count,'oy','numeric'):'<div></div>'}</div>
        <div id="dSched"></div>
      </section>
      <section class="csec"><h3>3. Xaridor</h3>
        ${personHTML('dc','Xaridor',f.client.name||'',f.client.phone||'',{req:true})}
        <div class="field"><label for="dAddr">Uy manzili <span class="req">*</span></label><textarea class="inp" id="dAddr" rows="2" placeholder="Viloyat, tuman, mahalla, ko‘cha, uy">${esc(f.client.address||'')}</textarea></div>
        <div class="field"><label for="dPass">Pasport / ID karta (ixtiyoriy)</label><input class="inp" id="dPass" value="${esc(f.client.passport||'')}" placeholder="AA 1234567" autocomplete="off"></div>
        <div id="dFace"></div>
      </section>
      <section class="csec"><h3>4. Kafil (vakil shaxs)</h3>
        ${personHTML('dg','Kafil',f.guarantor.name||'',f.guarantor.phone||'',{req:true})}
        <div class="field"><label for="dGAddr">Kafil manzili (ixtiyoriy)</label><input class="inp" id="dGAddr" value="${esc(f.guarantor.address||'')}" autocomplete="off"></div>
      </section>
      <section class="csec"><h3>5. Shartlar</h3>
        <details><summary>Shartnoma shartlarini ko‘rish (xaridor va kafilga o‘qib bering)</summary><ol class="clauses">${contractClauses(f).map(([n,t])=>`<li><b>${n}.</b> ${esc(t)}</li>`).join('')}</ol></details>
        <label class="check"><input type="checkbox" id="dConsent" ${f.consent?'checked':''}> Shartlar xaridor va kafilga o‘qib berildi, ular rozi <span class="req">*</span></label>
      </section>
      <section class="csec"><h3>6. Imzolar</h3>
        <div id="sgC"></div><div id="sgG"></div><div id="sgS"></div>
        <label class="check"><input type="checkbox" id="dRemSig" ${S.meta.sellerSig?'checked':''}> Sotuvchi imzosini keyingi shartnomalar uchun eslab qolish</label>
      </section>
      <div class="err" id="dErr" hidden></div>
      ${!isNew&&f.status==='draft'?`<button class="btn dan" type="button" id="dDel">Qoralamani o‘chirish</button><div class="confirm" id="dDelC" hidden><b>Bu shartnoma qoralamasi o‘chirilsinmi?</b><div class="g2"><button class="btn" type="button" id="dDelN">Yo‘q</button><button class="btn dan" type="button" id="dDelY">Ha, o‘chirish</button></div></div>`:''}
    </div><div class="sh-foot">${wasActive?'':'<button class="btn" type="button" id="dDraft">Keyinroq</button>'}<button class="btn pri grow" type="button" id="dSave">${wasActive?'Saqlash':'Shartnomani tasdiqlash'}</button></div>`;
    const drawSched=()=>{
      const tot=f.schedule.reduce((a,x)=>a+(+x.amount||0),0),R=rem();
      $('#dRem',c).innerHTML=pos(f.down)?`Oldindan: ${som(pos(f.down))} · Nasiyaga qoladi: <b>${som(R)}</b>`:`Nasiyaga qoladi: <b>${som(R)}</b>`;
      $('#dSched',c).innerHTML=`<div class="sched">${f.schedule.map((x,i)=>`<div class="srow"><span class="num">${i+1}.</span><input class="inp" type="date" data-sd="${i}" value="${x.due}" min="${f.date}" aria-label="${i+1}-to‘lov sanasi"><div class="suffix"><input class="inp num" data-sa="${i}" inputmode="numeric" value="${sp(Math.round(x.amount))}" aria-label="${i+1}-to‘lov summasi"><span>so'm</span></div></div>`).join('')}</div>
        <div class="row"><span class="hint grow num ${tot===R?'okc':'bad'}">Jadval jami: ${som(tot)}${tot===R?' ✓':` — ${som(R)} bo‘lishi kerak`}</span>${f.plan.mode==='monthly'?'<button class="btn sm" type="button" id="dRegen">Teng bo‘lish</button>':''}</div>`;
      $$('[data-sd]',c).forEach(el=>el.onchange=()=>{f.schedule[+el.dataset.sd].due=el.value});
      $$('[data-sa]',c).forEach(el=>{el.oninput=()=>{f.schedule[+el.dataset.sa].amount=Math.round(pos(el.value));const t2=f.schedule.reduce((a,x)=>a+(+x.amount||0),0);const h=$('#dSched .hint',c);h.className='hint grow num '+(t2===rem()?'okc':'bad');h.textContent=`Jadval jami: ${som(t2)}${t2===rem()?' ✓':` — ${som(rem())} bo‘lishi kerak`}`};el.onblur=()=>{el.value=sp(Math.round(pos(el.value)))}});
      const rg=$('#dRegen',c);if(rg)rg.onclick=()=>{gen();drawSched()};
    };
    drawSched();
    $('#dDescr',c).oninput=e=>{f.descr=e.target.value};
    const money=(id,k)=>{const el=$('#'+id,c);el.oninput=()=>{f[k]=Math.round(pos(el.value))||'';if(k==='down'){gen();drawSched()}};el.onblur=()=>{el.value=pos(el.value)?sp(Math.round(pos(el.value))):''}};
    money('dCash','cashPrice');money('dDown','down');
    $$('[data-pm]',c).forEach(b=>b.onclick=()=>{f.plan.mode=b.dataset.pm;gen();const top=c.scrollTop;debtSheetRedraw()});
    const debtSheetRedraw=()=>{closeSheet();setTimeout(()=>debtSheet(f,isNew),260)};
    $('#dFirst',c).onchange=e=>{f.plan.first=e.target.value;gen();drawSched()};
    const cnt=$('#dCount',c);if(cnt)cnt.oninput=()=>{f.plan.count=Math.round(pos(cnt.value))||2;gen();drawSched()};
    bindPerson(c,'dc',f.client,'name','phone',{role:'client'});
    bindPerson(c,'dg',f.guarantor,'name','phone',{role:'kafil'});
    $('#dAddr',c).oninput=e=>{f.client.address=e.target.value};$('#dPass',c).oninput=e=>{f.client.passport=e.target.value};$('#dGAddr',c).oninput=e=>{f.guarantor.address=e.target.value};
    mountPhoto($('#dFace',c),{label:'Xaridor yuzi surati',req:true,value:f.face,front:true,max:640,onChange:v=>{f.face=v}});
    $('#dConsent',c).onchange=e=>{f.consent=e.target.checked};
    mountSig($('#sgC',c),{label:'Xaridor imzosi',req:true,value:f.sig.client,onChange:v=>{f.sig.client=v}});
    mountSig($('#sgG',c),{label:'Kafil imzosi',req:true,value:f.sig.guarantor,onChange:v=>{f.sig.guarantor=v}});
    mountSig($('#sgS',c),{label:'Sotuvchi imzosi',req:true,value:f.sig.seller,onChange:v=>{f.sig.seller=v}});
    const finish=async(active)=>{
      const err=$('#dErr',c);const miss=[];
      const tot=f.schedule.reduce((a,x)=>a+(+x.amount||0),0);
      if(active){
        if(!String(f.client.name||'').trim())miss.push('xaridor ismi');
        if(digits(f.client.phone).length<9)miss.push('xaridor telefoni');
        if(!String(f.client.address||'').trim())miss.push('uy manzili');
        if(!f.face)miss.push('xaridor surati');
        if(!String(f.guarantor.name||'').trim()||digits(f.guarantor.phone).length<9)miss.push('kafil ismi va telefoni');
        if(tot!==rem())miss.push(`to‘lov jadvali (${som(rem())} bo‘lishi kerak)`);
        if(f.schedule.some(x=>!x.due||x.due<f.date))miss.push('to‘lov sanalari');
        if(!f.consent)miss.push('shartlarga rozilik belgisi');
        if(!f.sig.client)miss.push('xaridor imzosi');if(!f.sig.guarantor)miss.push('kafil imzosi');if(!f.sig.seller)miss.push('sotuvchi imzosi');
        if(miss.length){err.innerHTML='To‘ldirilmagan: '+miss.map(esc).join(', ')+'.';err.hidden=false;err.scrollIntoView({block:'nearest'});return}
      }
      f.client.phone=normPhone(f.client.phone);f.guarantor.phone=normPhone(f.guarantor.phone);
      f.client.name=String(f.client.name||'').trim();f.guarantor.name=String(f.guarantor.name||'').trim();
      if(active){f.status='active';f.activatedAt=f.activatedAt||Date.now();f.consentAt=f.consentAt||Date.now()}else f.status=f.status==='active'?'active':'draft';
      if($('#dRemSig',c).checked&&f.sig.seller)await setMeta('sellerSig',f.sig.seller);else if(!$('#dRemSig',c).checked&&S.meta.sellerSig)await setMeta('sellerSig','');
      const cl=await upsertClient({name:f.client.name,phone:f.client.phone,address:f.client.address,role:'client'});if(cl)f.clientId=cl.id;
      if(f.guarantor.name||f.guarantor.phone)await upsertClient({name:f.guarantor.name,phone:f.guarantor.phone,address:f.guarantor.address,role:'kafil'});
      if(!(f.events||[]).length&&active)f.events=[{ts:Date.now(),date:today(),text:'Shartnoma tuzildi va imzolandi'}];
      await saveDebt(f);closeSheet();render();
      if(active)setTimeout(()=>debtView(f),260);else toast('Qoralama saqlandi. Nasiya bo‘limidan to‘ldirasiz.');
    };
    $('#dSave',c).onclick=()=>finish(true);
    const dr=$('#dDraft',c);if(dr)dr.onclick=()=>finish(false);
    const dd=$('#dDel',c);if(dd){dd.onclick=()=>{$('#dDelC',c).hidden=false};$('#dDelN',c).onclick=()=>{$('#dDelC',c).hidden=true};
      $('#dDelY',c).onclick=async()=>{await DB.del('debts',f.id);S.debts=S.debts.filter(x=>x.id!==f.id);rescheduleReminders();closeSheet();render();toast('O‘chirildi')}}
  });
}

function debtView(d){
  if(!d)return;
  openSheet(`Nasiya · ${d.client.name||d.no}`,api=>{
    const c=api.content;
    const draw=()=>{
      d=S.debts.find(x=>x.id===d.id)||d;
      const rows=instRows(d),st=debtState(d),left=debtLeft(d),paid=debtPaid(d)+pos(d.down);
      const dueRow=rows.find(x=>x.left>0&&(x.st==='today'||x.st==='overdue'));
      const brRow=rows.find(x=>x.left>0&&x.st==='breach');
      const pct=d.total?Math.min(100,Math.round(paid/d.total*100)):0;
      c.innerHTML=`<div class="sh-body">
        <div class="dhead">${d.face?`<img class="face" src="${d.face}" alt="Xaridor surati">`:`<div class="face ph" aria-hidden="true">${esc((d.client.name||'?').charAt(0))}</div>`}
          <div class="grow" style="min-width:0"><b style="font-size:18px">${esc(d.client.name||'Mijoz')}</b><div class="hint num">${esc(d.no)} · ${dmy(d.date)}${multiWp()?' · '+esc(wpName(d.wp)):''}</div>
          ${d.client.phone?`<a class="btn sm" href="${telHref(d.client.phone)}">${ICON.call} ${esc(fmtPhone(d.client.phone))}</a>`:''}</div>${debtChip(d)}</div>
        <div class="card"><div class="row"><span class="grow">Qoldiq qarz</span><b class="num" style="font-size:22px">${som(left)}</b></div>
          <div class="meter" style="margin:8px 0"><i style="width:${pct}%"></i></div><div class="hint num">To‘langan: ${som(paid)} / ${som(d.total)}${pos(d.down)?` (oldindan ${som(pos(d.down))})`:''}</div></div>
        ${st==='draft'?`<div class="note-n"><b>Shartnoma to‘liq emas.</b> Xaridor, kafil, surat va imzolarni to‘ldiring — shunda eslatmalar ishlaydi va hujjat kuchga ega bo‘ladi.<div style="margin-top:8px"><button class="btn pri" type="button" id="vFill">Shartnomani to‘ldirish</button></div></div>`:''}

          <div class="hint">«Halol bo‘ldi» — mijoz shu summani to‘ladi. «Halol bo‘lmadi» — to‘lov qilinmadi: shartnoma va chora-tadbirlar ochiladi.</div></div>`:''}
        ${brRow?`<div class="breach"><b>Shartnoma buzildi</b><div>${dmy(brRow.due)} dagi ${som(brRow.left)} to‘lov o‘z vaqtida qilinmadi.</div>
          <div class="hint">Avval sababini biling: mijoz yoki kafilga qo‘ng‘iroq qiling. Kelishilsa, muddatni cho‘zing. Kelishilmasa, hujjatni PDF qilib tegishli organlarga murojaat qilishingiz mumkin.</div>
          <div class="pbtns">${d.client.phone?`<a class="btn" href="${telHref(d.client.phone)}">${ICON.call} Xaridor</a>`:''}${d.guarantor&&d.guarantor.phone?`<a class="btn" href="${telHref(d.guarantor.phone)}">${ICON.call} Kafil: ${esc(d.guarantor.name||'')}</a>`:''}</div>
          <div class="g2"><button class="btn" type="button" id="vExt">Muddatni cho‘zish</button><button class="btn" type="button" id="vPayB">To‘lov qabul qilish</button></div>
          <button class="btn dan" type="button" id="vLegal">Huquqiy hujjat (PDF): shartnoma + dalolatnoma</button></div>`:''}

        <div class="tw"><table><thead><tr><th>Sana</th><th class="r">Summa</th><th class="r">To‘landi</th><th>Holat</th></tr></thead><tbody>
          ${rows.map(x=>`<tr><td>${dmy(x.due)}</td><td class="r">${sp(x.amount)}</td><td class="r">${sp(x.cov)}</td><td>${INST_CHIP[x.st]}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Jadval tuzilmagan</td></tr>'}
        </tbody></table></div>
        ${(d.payments||[]).length?`<div class="h">To‘lovlar</div><div class="list">${d.payments.slice().sort((a,b)=>a.date<b.date?1:-1).map(p=>`<div class="mv"><span class="sg in" aria-hidden="true">+</span><span class="grow"><b class="num">${som(p.amount)}</b><div class="hint">${dmy(p.date)} · ${PAYS[p.method]||p.method}${p.cardTo&&cardById(p.cardTo)?' · '+esc(cardLabel(cardById(p.cardTo))):''}${p.note?' · '+esc(p.note):''}</div></span></div>`).join('')}</div>`:''}

        <div class="row"><input class="inp grow" id="vNote" placeholder="Masalan: 10-noyabrgacha to‘lashini aytdi" autocomplete="off"><button class="btn" type="button" id="vNoteAdd">Qo‘shish</button></div>
        <div class="g2"><button class="btn pri" type="button" id="vPay" ${left?'':'disabled'}>To‘lov qabul qilish</button><button class="btn acc" type="button" id="vPdf" ${st==='draft'?'disabled':''}>Shartnoma PDF</button></div>
        <div class="g2"><button class="btn" type="button" id="vEdit">Shartnomani ochish</button><button class="btn" type="button" id="vExt2" ${left?'':'disabled'}>Muddatni cho‘zish</button></div>
      </div>`;
      const on=(id,fn)=>{const el=$('#'+id,c);if(el)el.onclick=fn};

function extendSheet(d,row){
  if(!row)return;
  openSheet('Muddatni cho‘zish',api=>{
    const c=api.content;const f={to:addDays(row.due>today()?row.due:today(),7),reason:''};
    c.innerHTML=`<div class="sh-body"><div class="hint">Hozirgi muddat: <b>${dmy(row.due)}</b> · ${som(row.left)}</div>
      <div class="field"><label for="eTo">Yangi muddat</label><input class="inp" type="date" id="eTo" value="${f.to}" min="${addDays(today(),1)}"></div>
      <div class="field"><label for="eWhy">Sabab (mijoz nima dedi)</label><input class="inp" id="eWhy" placeholder="Masalan: maosh kechikdi, 10-sanada to‘laydi" autocomplete="off"></div>
      <label class="check"><input type="checkbox" id="eLater" checked> Keyingi to‘lovlarni ham shuncha kunga surish</label>
      </div><div class="sh-foot"><button class="btn pri block" type="button" id="eSave">Muddatni cho‘zish</button></div>`;
    $('#eTo',c).onchange=e=>{f.to=e.target.value};$('#eWhy',c).oninput=e=>{f.reason=e.target.value};
    $('#eSave',c).onclick=async()=>{
      if(!f.to||f.to<=today()){toast('Kelajakdagi sanani tanlang');return}
      const shift=daysBetweenISO(row.due,f.to);const it=d.schedule.find(x=>x.id===row.id);
      const later=$('#eLater',c).checked;
      d.schedule.forEach(x=>{if(x.id===it.id){x.due=f.to;x.breach=false}else if(later&&x.due>row.due)x.due=addDays(x.due,shift)});
      d.extensions=[...(d.extensions||[]),{ts:Date.now(),date:today(),inst:it.id,from:row.due,to:f.to,reason:f.reason.trim()}];
      d.events=[...(d.events||[]),{ts:Date.now(),date:today(),text:`Muddat ${dmy(row.due)} → ${dmy(f.to)} ga cho‘zildi${f.reason.trim()?': '+f.reason.trim():''}`}];
      await saveDebt(d);closeSheet();render();refreshSheets();toast('Muddat cho‘zildi');
    };
  });
}

/* ---------- reminders (Android notifications) ---------- */
function hash32(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>1)%2147483000+1}
let remindT;
function rescheduleReminders(){clearTimeout(remindT);remindT=setTimeout(doReminders,600)}
async function doReminders(){
  if(!NATIVE)return;
  try{
    const LN=plug('LocalNotifications');const now=Date.now();const items=[];
    S.debts.forEach(d=>{if(d.status!=='active')return;instRows(d).forEach(it=>{if(it.left<=0)return;
      [[-3,'Nasiya muddatiga 3 kun qoldi'],[0,'Bugun nasiya to‘lov kuni']].forEach(([k,title])=>{
        const at=parseISO(addDays(it.due,k));at.setHours(9,0,0,0);if(at.getTime()<=now)return;
        items.push({id:hash32(d.id+'|'+it.id+'|'+k),title,body:`${d.client.name||'Mijoz'} · ${som(it.left)} · ${dmy(it.due)}`,schedule:{at,allowWhileIdle:true},smallIcon:'ic_stat_muhasib',extra:{debtId:d.id}})})})});
    const pend=await LN.getPending();if(pend&&pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    if(!items.length)return;
    let perm=await LN.checkPermissions();if(perm.display!=='granted')perm=await LN.requestPermissions();if(perm.display!=='granted')return;
    items.sort((a,b)=>a.schedule.at-b.schedule.at);
    await LN.schedule({notifications:items.slice(0,60)});
  }catch(e){console.warn('reminders',e)}
}

      <div class="field"><label for="fAddr">Manzil</label><input class="inp" id="fAddr" value="${esc(f.dlv.addr)}" placeholder="Qayerga" autocomplete="off"></div></div>

    const parts=[];if(r.m3)parts.push(fq(r.m3,4)+' m³');if(r.m2)parts.push(fq(r.m2,2)+' m²');if(r.pm&&f.unit!=='pm')parts.push(fq(r.pm,2)+' p.m');

    $('#rT',c).innerHTML=`${sp(final)}<small>so'm</small>`;
    proofChk();
    const pp=prod(f.productId),rs=$('#rS',c);const old=f.id&&S.sales.find(x=>x.id===f.id);
    if(rs&&tracked(pp)&&(!old||saleCounts(old,pp))){
      let cur=stockOf(pp,null,f.wp).val;if(old&&wpOf(old)===f.wp){const ox=toUnit(old,pp.stockUnit,pp);if(ox)cur+=ox}
      const nx=toUnit({unit:f.unit,qty:r.qty,mode:f.mode,n:r.n,m3:r.m3,m2:r.m2,pm:r.pm},pp.stockUnit,pp);rs.hidden=false;
      if(nx==null){rs.className='stockline';rs.textContent=`Omborda: ${fqu(cur,pp.stockUnit)}. Bu sotuv qoldiqdan ayrilmaydi: ${UNITS[f.unit].n} → ${UNITS[pp.stockUnit].n} o'girish uchun o'lcham kerak.`}
      else{const af=r4(cur-nx);rs.className='stockline num'+(af<0?' bad':'');rs.textContent=`Omborda: ${fqu(cur,pp.stockUnit)} → sotuvdan keyin: ${fqu(af,pp.stockUnit)}${af<0?' (yetmaydi!)':''}`}
    }else if(rs)rs.hidden=true;
  };
  const bind=()=>{
    const map={fPieces:'pieces',fT:'t',fW:'w',fL:'l',fA:'a',fB:'b',fC:'c',fDirect:'direct',fPrice:'price',fDate:'date'};
    Object.entries(map).forEach(([id,k])=>{const el=$('#'+id,c);if(!el)return;el.addEventListener('input',()=>{f[k]=el.value;update()})});
    const pr=$('#fPrice',c);pr.addEventListener('blur',()=>{const n=pos(pr.value);pr.value=n?sp(Math.round(n)):''});

      const ms=modesFor(f.unit);f.mode=ms.includes('pieces')&&pp&&hasDims(pp)?'pieces':ms.includes(f.mode)?f.mode:ms[0];if(f.mode==='kuzov'&&!ms.includes('kuzov'))f.mode='direct';draw()});

      const lb=c.querySelector('.person .lbl');if(lb)lb.innerHTML='Mijoz'+(f.pay==='nasiya'?' <span class="req">*</span>':'')});
    bindPerson(c,'fc',f,'client','phone',{role:'client'});
    $('#fDlvOn',c).onchange=e=>{f.dlvOn=e.target.checked;drawDlv()};
    const bp=$('#fBackPick',c);if(bp)bp.onclick=()=>pickStep(api,{pay:f.pay});
    $('#fSave',c).onclick=()=>saveSale(f,R());
    const d=$('#fDel',c);if(d){d.onclick=()=>{$('#fDelC',c).hidden=false;$('#fDelC',c).scrollIntoView({block:'nearest'})};$('#fDelN',c).onclick=()=>{$('#fDelC',c).hidden=true};
      $('#fDelY',c).onclick=async()=>{await DB.del('sales',f.id);S.sales=S.sales.filter(s=>s.id!==f.id);closeSheet();render();toast("Sotuv o'chirildi")}}
  };
  draw();
}
async function saveSale(f,{r,d,final}){
  const err=$('#fErr');
  const fail=m=>{err.textContent=m;err.hidden=false;err.scrollIntoView({block:'nearest'})};
  if(!r.qty)return fail(f.mode==='pieces'?"Dona sonini va o'lchamlarni kiriting.":f.mode==='kuzov'?"Kuzov o'lchamlarini kiriting.":'Miqdorni kiriting.');
  if(!r.calcSum)return fail('Narxni kiriting.');
  if(final<=0)return fail("Chegirma summadan katta bo'lib qoldi.");
  if(f.pay==='nasiya'&&!String(f.client||'').trim()&&!digits(f.phone))return fail('Nasiya uchun mijoz ismi va telefonini kiriting.');
  if(f.pay==='karta'&&myCards().length&&!f.card.to)return fail('Pul qaysi kartangizga tushganini tanlang.');
  const cl=await upsertClient({name:f.client,phone:f.phone,role:'client'});
  const cto=f.pay==='karta'?cardById(f.card.to):null;
  const s={id:f.id||uid('s'),ts:f.ts||Date.now(),date:f.date||today(),wp:f.wp||curWp(),productId:f.productId,productName:f.productName,unit:f.unit,mode:f.mode,
    n:r.n,t:pos(f.t)||'',w:pos(f.w)||'',l:pos(f.l)||'',a:pos(f.a)||'',b:pos(f.b)||'',c:pos(f.c)||'',
    qty:r.qty,m3:r.m3,m2:r.m2,pm:r.pm,price:r.price,calc:r.calcSum,override:d.amount?final:0,total:final,
    disc:d.amount?{on:f.discOn,kind:f.disc.kind,v:f.disc.v,amount:d.amount,unitPrice:Math.round(d.unitPrice)}:null,
    pay:f.pay||'naqd',client:String(f.client||'').trim(),phone:normPhone(f.phone),clientId:cl?cl.id:'',note:f.note||'',
    card:f.pay==='karta'?{to:f.card.to||'',toLabel:cto?cardLabel(cto):'',from:cardDigits(f.card.from),proofPhoto:f.card.proofPhoto||'',proofText:String(f.card.proofText||'').trim()}:null,
    dlv:f.dlvOn?{driver:String(f.dlv.driver||'').trim(),phone:normPhone(f.dlv.phone),car:String(f.dlv.car||'').trim(),addr:String(f.dlv.addr||'').trim(),photo:f.dlv.photo||''}:null};
  if(s.date>today())s.date=today();
  if(s.dlv&&(s.dlv.driver||s.dlv.phone))await upsertClient({name:s.dlv.driver,phone:s.dlv.phone,role:'driver'});
  await DB.put('sales',s);
  const i=S.sales.findIndex(x=>x.id===s.id);if(i>=0)S.sales[i]=s;else S.sales.push(s);
  const p=prod(f.productId);
  if(p&&f.saveP&&r.price&&pos(p.prices[f.unit])!==r.price){p.prices={...p.prices,[f.unit]:r.price};await DB.put('products',p)}
  if(!S.meta.persistAsked&&navigator.storage&&navigator.storage.persist){setMeta('persistAsked',1);navigator.storage.persist().catch(()=>{})}
  const debt=S.debts.find(x=>(x.saleIds||[]).includes(s.id));
  if(debt&&debt.status==='draft'){debt.items=[saleItemForDebt(s)];debt.total=s.total;await saveDebt(debt)}
  S.day=s.date;closeSheet();render();
  if(s.pay==='nasiya'&&!debt){setTimeout(()=>debtSheet(newDebtFromSale(s),true),260);return}
  toast(f.id?(debt&&debt.status!=='draft'&&debt.total!==s.total?"Saqlandi. Shartnoma summasi o'zgarmadi — nasiya bo'limida tekshiring":'Saqlandi'):`Yozildi: ${som(s.total)}`);
}
